nameOverride: ""
fullnameOverride: aws-tunnels-operator
namespaceOverride: ""

image:
  repository: ghcr.io/coollision/aws-tunnels-operator
  tag: v0.8.1
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  create: true
  authPort: 8090

ingress:
  enabled: false
  entryPoints:
    - websecure
  tls: true

operatorArgs:
  metricsBindAddress: :8080
  healthProbeBindAddress: :8081

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

affinity: {}
tolerations: []
nodeSelector: {}

# ArgoCD resource tracking. The operator labels and annotates all managed resources
# (Deployments, Services, Secrets, IngressRoutes) with app.kubernetes.io/instance
# and argocd.argoproj.io/tracking-id so they appear in the ArgoCD app UI.
# Defaults to the Helm release name (which equals the ArgoCD app name in most setups).
# Set explicitly to override, or to "" to disable.
argoApp:
  name: ""

stackConfig:
  name: aws-tunnels-operator-stack

# Single stack desired state consumed by the operator from ConfigMap.
stack:
  name: aws-tunnels
  aws:
    profile: awsprofile001
    region: eu-west-1
    ssoStartUrl: ""
    accountId: ""
    roleName: ""
    extraProfiles: []
    # useRefresh: render the modern sso-session config (sso_registration_scopes) so `aws sso login` mints a
    # REFRESH TOKEN and the operator silently auto-refreshes STS creds for the whole SSO session.
    # The in-cluster login also switches to the device-code flow (remote-clickable) and the token
    # cache is persisted to the <stack>-sso-token Secret. Tunnels mount the creds Secret and read
    # rotated creds in place, so they are NOT rolled (no ~hourly connection drop) when creds refresh.
    # When false (default), the legacy inline format is used, creds arrive as env vars, and a manual
    # login + pod roll is needed whenever creds expire (prior behavior).
    useRefresh: false
  auth:
    enabled: true
    host: ""
    port: 8090
  shared:
    awsConfigMapName: ""
  nodeAffinity:
    excludedType: ""
  tunnelDefaults:
    image: ghcr.io/coollision/aws-tunnel-runner:v0.8.1
    proxyImage: alpine/socat:1.8.1.3
    servicePort: 8080
    # Pods per tunnel, i.e. independent SSM sessions. AWS rate-limits each session to ~0.7 MB/s
    # and all connections through one tunnel share a single session, so raising this helps only
    # workloads that open several connections — a single stream gains nothing. Overridable per
    # tunnel, and adjustable at runtime from the auth UI (which pins it until reset).
    replicas: 1
    # Compressed SSH transport. Forwards the bastion's :22 over SSM and runs `ssh -C -L` through
    # it, so payloads are gzipped BEFORE crossing the ~0.7 MB/s cap. Measured 3.8x on a Postgres
    # bulk read; plain SSH with no compression measures the same as raw SSM, so the gain is
    # entirely from sending fewer bytes.
    #
    # Requires ec2-instance-connect:SendSSHPublicKey on the tunnel's AWS role. Keys are ephemeral
    # (60s), so nothing long-lived is stored on the bastion.
    #
    # Do NOT enable for tls.passthrough tunnels: their payload is client-to-target ciphertext,
    # which cannot compress and measurably slows down (0.61 -> 0.56 MB/s). To use this on a DB
    # tunnel, terminate TLS at the ingress instead (tls.secretName).
    ssh:
      enabled: false
      # compression: true      # -C; the entire benefit. false = plain SSH (no gain, no loss).
      # user: ec2-user         # bastion OS user
      # localSshPort: 2222     # loopback port for the bastion :22 forward; must differ from localPort
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    proxyResources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
  tunnels: []
