vaultwardendb:
  syncWave: -10
  fullnameOverride: vaultwarden-db
  statefulset:
    image:
      repository: mariadb
      tag: 12.3.3
    ports:
      mysql: 3306
  config:
    ServerName: mariadb
    MYSQL_ROOT_PASSWORD: <secret:kv/data/secrets/vaultwarden-db~root-password>
    MYSQL_AUTO_UPGRADE: Enabled
    MYSQL_DATABASE: <secret:kv/data/secrets/vaultwarden-db~name>
    MYSQL_USER: <secret:kv/data/secrets/vaultwarden-db~user>
    MYSQL_PASSWORD: <secret:kv/data/secrets/vaultwarden-db~password>

    MARIADB_INNODB_BUFFER_POOL_SIZE: 64M
    MARIADB_MAX_CONNECTIONS: 20

  storage:
    - mountPath: /var/lib/mysql
      size: 512Mi
      type: longhorn
      nameSuffix: mysql
      volumeName: vaultwarden-db-mysql
      protect: true

  # These were keyed `livenessProbe:`/`readinessProbe:`, but shared-lib.probes reads
  # `probes.liveness`/`probes.readiness` — so both were silently dropped and MariaDB ran
  # with no health checks at all.
  #
  # The dropped commands were also `mysqladmin ping`, which does NOT exist in this image:
  # MariaDB removed the legacy mysql* client symlinks, so it is `mariadb-admin` now. Being
  # dead config had hidden that. Do not reintroduce `mysqladmin` here.
  #
  # `mariadb-admin ping` is a poor probe anyway: with no credentials it prints
  # "Access denied for user 'root'@'localhost'" and STILL exits 0, so it passes for the
  # wrong reason. The image ships /usr/local/bin/healthcheck.sh for exactly this; verified
  # in-container that `--su-mysql --connect` exits 0 silently on a healthy server.
  # (`--innodb` is not a valid option in this image version.)
  probes:
    liveness:
      exec:
        command: [/usr/local/bin/healthcheck.sh, --su-mysql, --connect]
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 4
    readiness:
      exec:
        command: [/usr/local/bin/healthcheck.sh, --su-mysql, --connect]
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 4
    # MariaDB may run its own upgrade/recovery on start (MYSQL_AUTO_UPGRADE), which is what
    # the old initialDelaySeconds values were compensating for. 24 x 5s = 120s of headroom.
    startup:
      exec:
        command: [/usr/local/bin/healthcheck.sh, --su-mysql, --connect]
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 24
  # cpu limit was 300m: cgroup cpu.stat showed ~33% of periods throttled
  # (nr_throttled 4120 / nr_periods 12395) despite ~9m average usage — InnoDB's
  # background threads (checkpoint/purge/IO) burst briefly above the ceiling even
  # when idle overall. worker-silver has ample headroom (18% CPU used cluster-wide),
  # so raised the ceiling rather than the (already-generous 30x) request:limit ratio.
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 320Mi
  labels:
    app.kubernetes.io/component: vaultwarden-db

vaultwarden:
  fullnameOverride: vaultwarden
  statefulset:
    image:
      repository: vaultwarden/server
      tag: 1.37.2
    ports:
      web: 80
  # IMPORTANT — what this block can and cannot control.
  #
  # Vaultwarden persists admin-panel settings to /data/config.json (on the Longhorn PVC),
  # and config.json ALWAYS wins over the environment. On every start it logged:
  #
  #   [WARNING] The following environment variables are being overridden by the config.json
  #   file: SIGNUPS_ALLOWED, ADMIN_TOKEN, SMTP_HOST, SMTP_SECURITY, SMTP_PORT, SMTP_FROM,
  #          SMTP_USERNAME, SMTP_PASSWORD
  #
  # Those eight keys were declared here but had no effect whatsoever, so this file read as
  # the source of truth for settings it did not actually own. They have been removed rather
  # than left as decorative config. config.json owns them; change them in the admin panel.
  #
  # One of them was also outright wrong, which the override had been masking:
  # SMTP_SECURITY was "true", not a valid value (starttls | force_tls | off). Had
  # config.json ever been reset, mail would have broken. config.json has "starttls".
  #
  # Only env-only settings — ones config.json does not carry — belong below.
  config:
    TZ: Europe/Brussels
    DATABASE_URL: mysql://<secret:kv/data/secrets/vaultwarden-db~user>:<secret:kv/data/secrets/vaultwarden-db~password>@vaultwarden-db-service/<secret:kv/data/secrets/vaultwarden-db~name>
    RUST_BACKTRACE: 1
    #    vaultwarden push notifications
    PUSH_ENABLED: true
    PUSH_INSTALLATION_ID: <secret:kv/data/secrets/vaultwarden~Installation_ID>
    PUSH_INSTALLATION_KEY: <secret:kv/data/secrets/vaultwarden~Installation_Key>
    PUSH_RELAY_URI: "https://api.bitwarden.eu"
    PUSH_IDENTITY_URI: "https://identity.bitwarden.eu"

  ingress_internal_secure:
    host: vaultwarden.<secret:kv/data/domains~domain>
    port: web
  ingress_external_secure:
    host: vaultwarden.<secret:kv/data/domains~domain>
    port: web
  storage:
    - mountPath: /data
      size: 512Mi
      type: longhorn
      nameSuffix: data
      volumeName: vaultwarden-data
      protect: true
  probes:
    liveness:
      httpGet:
        path: /
        port: web
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      httpGet:
        path: /
        port: web
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5

  resources:
    requests:
      cpu: 70m
      memory: 288Mi
    limits:
      cpu: 300m
      memory: 416Mi
  labels:
    app.kubernetes.io/component: vaultwarden
