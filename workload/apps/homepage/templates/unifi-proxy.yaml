# UniFi console proxy: Homepage's unifi widget needs the Network API over a certificate it can verify, but the
# console only has a self-signed one (no IP SAN). Traefik fronts it with the wildcard cert, like the Technitium
# proxy. The gateway address lives in Vault, never in git. Internal secure entrypoint only.
apiVersion: v1
kind: Service
metadata:
  name: unifi-proxy
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# Classic Endpoints (no selector on the Service): the endpointslice mirroring controller derives the
# EndpointSlice from it, so this works for any Traefik version.
apiVersion: v1
kind: Endpoints
metadata:
  name: unifi-proxy
  namespace: {{ .Release.Namespace }}
subsets:
  - addresses:
      - ip: <secret:kv/data/workload/apps/homepage~unifi-gateway>
    ports:
      - name: https
        port: 443
---
# The console's own certificate is self-signed, so the Traefik -> console hop skips verification (LAN only).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-proxy
  namespace: {{ .Release.Namespace }}
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi-proxy
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`unifi.<secret:kv/data/shared/domains~domain>`)
      services:
        - kind: Service
          name: unifi-proxy
          namespace: {{ .Release.Namespace }}
          port: 443
          scheme: https
          serversTransport: unifi-proxy
  tls: {}
