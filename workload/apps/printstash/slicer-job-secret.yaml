# Consumed ONLY by the on-demand slicing Job (see app-patch-configmap.yaml's
# ingestion.py patch, which builds that Job's env from this Secret) --
# deliberately NOT mounted into printstash's own Deployment/pod env, same
# reasoning as makerworld-job-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: printstash-slicer-job-creds
type: Opaque
stringData:
  PRINTSTASH_URL: <secret:kv/data/apps/printstash-slicer-job~url>
  PRINTSTASH_USERNAME: <secret:kv/data/apps/printstash-slicer-job~username>
  PRINTSTASH_API_KEY: <secret:kv/data/apps/printstash-slicer-job~api_key>
