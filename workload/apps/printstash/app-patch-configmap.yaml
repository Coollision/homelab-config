            model = kwargs.get("model")
            if not isinstance(model, Model) or model.id is None:
                raise RuntimeError("artifact_model_not_persisted")
            lock = _ARTIFACT_LOCKS[model.id % len(_ARTIFACT_LOCKS)]
            with lock:
