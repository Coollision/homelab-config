# TEMPORARY WORKAROUNDS for two open upstream PrintStash fixes not yet in a
# released image:
#   - https://github.com/xiao-villamor/PrintStash/pull/183 (session-cookie
#     auth on the import routes) -> app/core/browser_device_auth.py
#   - https://github.com/xiao-villamor/PrintStash/pull/185 (Printables
#     GraphQL schema drift)                -> app/modules/ingestion/import_resolvers.py
# Mounts a shared emptyDir over the whole /app/app source tree (~3.2M, cheap
# to copy) rather than one mount per file, so adding/removing a patched file
# here only touches app-patch-configmap.yaml and this init container's copy
# list. Remove the patched files, the ConfigMap, and this patch once both PRs
# merge and values.yaml's image digest moves past them — check each
# independently, they may land in different releases.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: printstash
spec:
  template:
    metadata:
      annotations:
        # Fixed ConfigMap name (see kustomization.yaml for why, instead of a
        # hash-suffixed configMapGenerator), so this checksum is what actually
        # forces a rollout when app-patch-configmap.yaml's content changes.
        # Bump it to any different value whenever that file's data changes —
        # it doesn't need to be a real hash of anything, only to differ.
        printstash.workload/app-patch-checksum: "896363e543e57f12f1eb52b8ed14dc44523c7673b60679cbdc03ac86b837110"
    spec:
      volumes:
        - name: app-patched
          emptyDir: {}
        - name: app-patch-files
          configMap:
            name: printstash-app-patch
      initContainers:
        - name: patch-app-source
          image: ghcr.io/xiao-villamor/printstash@sha256:43e70cb95cf74487858396333cc2818804bcf2c08d5cc7031c042b7f2996058b
          command:
            - sh
            - -c
            - |
              set -e
              check() {
                src="$1"; expected="$2"; pr="$3"
                actual=$(sha256sum "$src" | cut -d' ' -f1)
                if [ "$actual" != "$expected" ]; then
                  echo "WARNING: $src no longer matches the hash this workaround expects."
                  echo "WARNING: upstream $pr may already be merged/released — check and remove that part of this kustomize patch."
                fi
              }
              check /app/app/core/browser_device_auth.py "$(cat /patch/browser_device_auth.py.sha256)" "PR #183"
              check /app/app/modules/ingestion/import_resolvers.py "$(cat /patch/import_resolvers.py.sha256)" "PR #185"
              cp -a /app/app/. /workspace/
              cp /patch/browser_device_auth.py /workspace/core/browser_device_auth.py
              cp /patch/import_resolvers.py /workspace/modules/ingestion/import_resolvers.py
              echo "patched browser_device_auth.py (PR #183) and import_resolvers.py (PR #185) in place"
          volumeMounts:
            - name: app-patched
              mountPath: /workspace
            - name: app-patch-files
              mountPath: /patch
      containers:
        - name: printstash
          volumeMounts:
            - name: app-patched
              mountPath: /app/app
