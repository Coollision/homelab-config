# Consumed ONLY by the on-demand MakerWorld importer Job (see
# app-patch-configmap.yaml's import_resolvers.py patch, which builds that
# Job's env from this Secret via secretKeyRef) -- deliberately NOT mounted
# into printstash's own Deployment/pod env at all, to keep these credentials
# out of the always-running process. See RUNBOOK.md's "MakerWorld import"
# section for what each value is and the rotation playbook.
#
# No longer holds PRINTSTASH_* credentials -- the Job only resolves the
# Cloudflare-gated download URL and prints it to its own logs now, it never
# calls PrintStash's API itself (see RUNBOOK.md for why that redesign
# happened). kv/apps/printstash-makerworld-importer and its API key are
# unused as of this change; harmless to leave in Vault, or delete it.
apiVersion: v1
kind: Secret
metadata:
  name: printstash-makerworld-job-creds
type: Opaque
stringData:
  MW_LOGIN_COOKIE: <secret:kv/data/apps/printstash-makerworld~token>
  MW_EDGE_COOKIE_A: <secret:kv/data/apps/printstash-makerworld~cf_clearance>
  MW_EDGE_COOKIE_B: <secret:kv/data/apps/printstash-makerworld~cf_bm>
