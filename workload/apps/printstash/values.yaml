fullnameOverride: printstash

podSecurityContext:
  fsGroup: 1000

deployment:
  image:
    # Our fork of the unified image: identical to upstream except the
    # open-in-slicer menu gains a PrintFlow entry (upstream hardcodes the list
    # and the frontend is a prebuilt bundle, so it must be a build-time change).
    # Source: github.com/Coollision/PrintStash, branch feat/external-web-slicer.
    repository: ghcr.io/coollision/printstash-unified
    tag: latest
  ports:
    http: 3000

config:
  TZ: Europe/Brussels
  # trusted_network skips the interactive first-run setup wizard/token exchange
  # since this is only reachable from inside the cluster network.
  VAULT_SETUP_MODE: trusted_network
  # Lets the app request its own container restart (e.g. after a Settings
  # change) — safe because the Deployment's restart policy brings it back up.
  VAULT_RESTART_ENABLED: "true"

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "2"
    # The RAM-aware mesh cap (backend/app/modules/media/mesh_processing.py)
    # derives its triangle ceiling from this cgroup limit: budget = limit *
    # mesh_memory_budget_fraction (0.5) / max_render_jobs (1), then triangles
    # = budget / 3600 bytes for a 3MF. At 2Gi that capped out at ~298k
    # triangles and 3D-preview/STL conversion 500'd on anything bigger
    # (model 55's dragon is ~364k). 4Gi raises the cap to ~596k triangles;
    # actual RSS usage stays low (~250Mi observed), this is a ceiling not a
    # reservation.
    memory: 4Gi

probes:
  # Confirmed against upstream: the unified image's own Dockerfile HEALTHCHECK
  # is `curl -fsS http://127.0.0.1:3000/api/v1/health` (backend/unified/Dockerfile
  # on main), and nginx proxies /api/v1 straight through to the FastAPI app on
  # 3000 — same path the split -api image's compose healthcheck uses on 8000.
  readiness:
    httpGet:
      path: /api/v1/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    httpGet:
      path: /api/v1/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

ingress_internal_secure:
  host: printstash.<secret:kv/data/domains~domain>
  port: http

storage:
  # The compose file's five volumes (files, thumbs, db, staging, backups) are
  # all subdirectories under /data, so a single PVC mounted at /data covers
  # all of them — no need for five separate Longhorn volumes. 15Gi is a
  # library-and-thumbnails budget for a hobby/homelab print queue, not a NAS;
  # bump it if the model library grows into the many-GB range.
  - mountPath: /data
    size: 15Gi
    type: longhorn
    volumeName: printstash-data
    nameSuffix: data
