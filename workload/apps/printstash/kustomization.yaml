apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TEMPORARY — hotfixes for two open upstream PrintStash PRs not yet in a
# released image, see app-source-patch.yaml for details:
#   - browser_device_auth.py   -> PR #183 (session-cookie auth)
#   - import_resolvers.py      -> PR #185 (Printables GraphQL schema drift)
# Remove this ConfigMap, the patch below, and the patched .py files once both
# PRs merge and values.yaml's pinned digest moves past them.
#
# A plain (fixed-name) ConfigMap, not configMapGenerator: kustomize's
# name-reference rewriting doesn't reliably follow a reference introduced
# through a `patches:` block in this pipeline's kustomize version — the
# generated hash-suffixed ConfigMap was created correctly, but the Deployment
# volume kept pointing at the old unsuffixed name and failed to mount. Instead
# app-source-patch.yaml carries a manual checksum annotation on the pod
# template (the standard Helm checksum/config idiom) computed from these two
# files — update it by hand whenever either file's content changes, so the
# pod template actually differs and Kubernetes rolls a new pod.
resources:
  - app-patch-configmap.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: printstash
    path: app-source-patch.yaml
