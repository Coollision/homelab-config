# RBAC for the MakerWorld importer: printstash's own pod creates a one-shot
# Job (see app-patch-configmap.yaml's import_resolvers.py patch), polls it to
# completion, and reads its pod's logs for the resolved download URL -- it
# no longer pushes anything itself (see RUNBOOK.md for why the design
# changed from a fire-and-forget push to a synchronous resolve). Each Job
# sets ttlSecondsAfterFinished itself so Kubernetes garbage-collects it; this
# role still has no delete verb, since GC handles cleanup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: printstash
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: printstash-makerworld-job-creator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: printstash-makerworld-job-creator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: printstash-makerworld-job-creator
subjects:
  - kind: ServiceAccount
    name: printstash
