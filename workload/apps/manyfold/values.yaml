fullnameOverride: manyfold
podSecurityContext:
  fsGroup: 1000
deployment:
  image:
    repository: ghcr.io/manyfold3d/manyfold-solo
    tag: "0.149.0"
  ports:
    http: 3214
config:
  TZ: Europe/Brussels
  PUID: "1000"
  PGID: "1000"
  SECRET_KEY_BASE: <secret:kv/data/apps/manyfold~secret_key_base>
  PUBLIC_HOSTNAME: manyfold.<secret:kv/data/domains~domain>
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
ingress_internal_secure:
  host: manyfold.<secret:kv/data/domains~domain>
  port: http
storage:
  - mountPath: /models
    size: 10Gi
    type: longhorn
    volumeName: manyfold-models
    nameSuffix: models
  - mountPath: /config
    size: 5Gi
    type: longhorn
    volumeName: manyfold-config
    nameSuffix: config
labels:
  app.kubernetes.io/component: manyfold
