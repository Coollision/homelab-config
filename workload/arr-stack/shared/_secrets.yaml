apiVersion: v1
kind: Secret
metadata:
  name: services-db
  namespace: arr-stack
type: Opaque
data:
  sonarr_user: <secret:kv/data/workload/arr-stack/sonarr~user | base64>
  sonarr_password: <secret:kv/data/workload/arr-stack/sonarr~password | base64>
  radarr_user: <secret:kv/data/workload/arr-stack/radarr~user | base64>
  radarr_password: <secret:kv/data/workload/arr-stack/radarr~password | base64>
  lidarr_user: <secret:kv/data/workload/arr-stack/lidarr~user | base64>
  lidarr_password: <secret:kv/data/workload/arr-stack/lidarr~password | base64>
  prowlarr_user: <secret:kv/data/workload/arr-stack/prowlarr~user | base64>
  prowlarr_password: <secret:kv/data/workload/arr-stack/prowlarr~password | base64>
  bazarr_user: <secret:kv/data/workload/arr-stack/bazarr~user | base64>
  bazarr_password: <secret:kv/data/workload/arr-stack/bazarr~password | base64>
  jellyseerr_user: <secret:kv/data/workload/arr-stack/jellyseerr~user | base64>
  jellyseerr_password: <secret:kv/data/workload/arr-stack/jellyseerr~password | base64>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-db
  namespace: arr-stack
data:
  host: service-db-pg-rw
  port: "5432"
  sonarr_database: sonarr_main
  sonarr_database_logs: sonarr_log
  lidarr_database: lidarr_main
  lidarr_database_logs: lidarr_log
  radarr_database: radarr_main
  radarr_database_logs: radarr_log
  prowlarr_database: prowlarr_main
  prowlarr_database_logs: prowlarr_log
  bazarr_database: bazarr_main
  jellyseerr_database: jellyseerr
