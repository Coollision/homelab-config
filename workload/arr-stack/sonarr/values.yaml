fullnameOverride: sonarr
statefulset:
  image:
    repository: linuxserver/sonarr
    tag: 4.0.20
    imagePullPolicy: Always
  ports:
    web: 8989

config:
  TZ: Europe/Brussels
  PUID: 1000
  PGID: 1000

arrXmlPostgres:
  enabled: true
  requireExistingConfig: false
  userKey: sonarr_user
  passwordKey: sonarr_password
  apiKeyKey: sonarr_api_key
  mainDbKey: sonarr_database
  logDbKey: sonarr_database_logs
  authenticationMethod: External

probes:
  readiness:
    httpGet:
      path: /ping
      port: web
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    httpGet:
      path: /ping
      port: web
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

resources:
  requests:
    cpu: 70m
    memory: 640Mi
  limits:
    cpu: 700m
    memory: 896Mi

ingress_internal:
  host: sonarr.<secret:kv/data/shared/domains~local>
  port: web

ingress_internal_secure:
  host: sonarr.<secret:kv/data/shared/domains~domain>
  port: web

homepage:
  group: Media
  icon: sonarr
  description: TV series
  widget:
    type: sonarr
    url: http://sonarr-service.arr-stack.svc.cluster.local:8989
    key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

storage:
  - type: longhorn
    mountPath: /config
    size: 2Gi
    nameSuffix: config
    volumeName: arr-stack-sonarr-config
    protect: true
  - type: existingClaim
    mountPath: /data/downloads
    claimName: arr-stack-downloads
    nameSuffix: downloads
  - type: existingClaim
    mountPath: /data/series
    claimName: arr-stack-series
    nameSuffix: series
