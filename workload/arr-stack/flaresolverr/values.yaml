fullnameOverride: flaresolverr
deployment:
  image:
    repository: ghcr.io/flaresolverr/flaresolverr
    tag: v3.5.2
  ports:
    web: 8191
config:
  TZ: Europe/Brussels
  PUID: 1000
  PGID: 1000

resources:
  # Chromium sat at ~99% of 512Mi (2026-11-08): kernel evicted its file pages, ~1100 major faults/s, NodeMemoryMajorPagesFaults.
  requests:
    cpu: 10m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000
probes:
  liveness:
    tcpSocket:
      port: web
    initialDelaySeconds: 30
    periodSeconds: 10
