aws-tunnels-operator:
  namespaceOverride: proxies
  fullnameOverride: aws-tunnels

  stackConfig:
    name: aws-tunnel-config

  ingress:
    enabled: true

  stack:
    aws:
      region: eu-central-1
      # Hands-off SSO auto-refresh: the operator silently re-mints STS creds from a captured
      # refresh token and tunnels read the rotated creds from a mounted Secret in place, so they
      # are not rolled (no ~hourly connection drop) when creds expire. Log in once per SSO session.
      useRefresh: true
      ssoStartUrl: <secret:kv/data/proxies/aws-tunnel~sso-start-url>
      accountId: <secret:kv/data/proxies/aws-tunnel~account-id>
      roleName: <secret:kv/data/proxies/aws-tunnel~sso-role-name>
      extraProfiles:
        - name: awsprofile001-prod
          region: eu-central-1
          ssoStartUrl: <secret:kv/data/proxies/aws-tunnel~prod-sso-start-url>
          accountId: <secret:kv/data/proxies/aws-tunnel~prod-account-id>
          roleName: <secret:kv/data/proxies/aws-tunnel~prod-sso-role-name>
    auth:
      host: aws-auth.<secret:kv/data/domains~domain>
    tunnelDefaults:
      # session-manager-plugin needs ~226m while streaming; the chart default limit of 200m
      # throttles it in ~80% of CFS periods (measured 2026-08-07). That costs latency jitter,
      # not throughput — a single SSM session tops out at ~700 KB/s regardless of CPU, so this
      # is a smoothness fix only. Requests stay low; tunnels idle at ~0m.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 128Mi
    # All three DB tunnels below run the compressed SSH transport, which requires TLS to terminate
    # at Traefik rather than pass through to RDS.
    #
    # Why both settings move together: passthrough routes by SNI, which forces the client to speak
    # TLS, which makes every byte crossing the tunnel client↔RDS ciphertext — and ciphertext cannot
    # be compressed. Terminating at the ingress creates a plaintext segment exactly where AWS's
    # ~0.7 MB/s per-session cap bites, so `ssh -C` can gzip it on the bastion first. Measured on a
    # Postgres bulk COPY: 0.62 → 2.36 MB/s (3.8x). See docs/aws-tunnels-throughput.md.
    #
    # Clients are unaffected: still sslmode=require to the same host on :443, and SNI still matches
    # because Traefik presents the default TLSStore wildcard.
    #
    # Trade-off: TLS is no longer one end-to-end session to the database. The path becomes
    # client→Traefik (TLS), Traefik→pod (in-cluster), pod→bastion (SSH), bastion→RDS (plaintext,
    # inside the VPC). rds.force_ssl verified 0 on dev, preprod and prod clusters (2026-08-07);
    # if that is ever turned on, the payload stays TLS end-to-end and the gain disappears.
    #
    # gitlab-dev is deliberately left alone — it already carries plaintext HTTP that GitLab gzips
    # for any client sending Accept-Encoding, so there is little left to win.
    tunnels:
      - name: gitlab-dev
        bastionName: bastion-dev
        remoteHost: <secret:kv/data/proxies/aws-tunnel~gitlab-dev-host>
        remotePort: "81"
        localPort: 18080
        host: gitlab-work.<secret:kv/data/domains~domain>
      - name: dev-db
        bastionName: bastion-dev
        remoteHost: ""
        remotePort: <secret:kv/data/proxies/aws-tunnel~dev-db-port>
        localPort: 15432
        host: dev-db-work.<secret:kv/data/domains~domain>
        ingressMode: tcp
        tls:
          passthrough: false
        ssh:
          enabled: true
        rds:
          clusterPrefix: <secret:kv/data/proxies/aws-tunnel~dev-db-cluster-prefix>
      - name: preprod-db
        bastionName: bastion-preprod
        remoteHost: ""
        remotePort: <secret:kv/data/proxies/aws-tunnel~preprod-db-port>
        localPort: 25432
        host: preprod-db-work.<secret:kv/data/domains~domain>
        ingressMode: tcp
        tls:
          passthrough: false
        ssh:
          enabled: true
        rds:
          clusterPrefix: <secret:kv/data/proxies/aws-tunnel~preprod-db-cluster-prefix>
      - name: prod-db
        bastionName: bastion-prod
        awsProfile: awsprofile001-prod
        awsRegion: eu-central-1
        remoteHost: ""
        remotePort: <secret:kv/data/proxies/aws-tunnel~prod-db-port>
        localPort: 35432
        host: prod-db-work.<secret:kv/data/domains~domain>
        ingressMode: tcp
        tls:
          passthrough: false
        ssh:
          enabled: true
        rds:
          clusterPrefix: <secret:kv/data/proxies/aws-tunnel~prod-db-cluster-prefix>
