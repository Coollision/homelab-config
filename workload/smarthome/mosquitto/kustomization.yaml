apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Patches for Helm-rendered resources
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: mosquitto
      namespace: smarthome
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
        - name: mosquitto-init
          image: eclipse-mosquitto:2.0.22-openssl
          command: ["/bin/sh", "/mosquitto/config/reconcile.sh"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
          - name: mosquitto-config
            mountPath: /mosquitto/config
          - name: mosquitto
            mountPath: /mosquitto/data
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/0
        value:
          name: mosquitto-config
          mountPath: /mosquitto/config
      - op: replace
        path: /spec/serviceName
        value: mosquitto-mqtt
      - op: add
        path: /spec/template/spec/volumes/0
        value:
          name: mosquitto-config
          configMap:
            name: mosquitto-config
  - target:
      group: ""
      version: v1
      kind: Service
      name: mosquitto-service
      namespace: smarthome
    patch: |-
      - op: replace
        path: /metadata/name
        value: mosquitto-mqtt
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /spec/loadBalancerIP
        value: <secret:kv/data/workload/smarthome/mosquitto~ip>
      # Local: the broker sees real client IPs (Cluster SNATs everything to a node's flannel
      # address). MetalLB then announces the IP from the node that runs the pod.
      - op: add
        path: /spec/externalTrafficPolicy
        value: Local
      - op: replace
        path: /spec/ports/0/port
        value: 1880

# ConfigMap from local file
configMapGenerator:
  - name: mosquitto-config
    namespace: smarthome
    files:
      - mosquitto.conf
      - reconcile.sh
    literals:
      # "true" = every role may read/write '#' (rollout phase: observe real usage first, then
      # trim to the per-role topics in reconcile.sh). Also the break-glass. A change rolls the pod.
      - acl-learning=true
      # New Vault key, format "user:password"; only for mosquitto_ctrl, never used by clients.
      - admin-credential=<secret:kv/data/workload/smarthome/mosquitto~admin-credential>
      - credential1=<secret:kv/data/workload/smarthome/mosquitto~credential-1>
      - credential2=<secret:kv/data/workload/smarthome/mosquitto~credential-2>
      - credential4=<secret:kv/data/workload/smarthome/mosquitto~credential-4>
      - credential5=<secret:kv/data/workload/smarthome/mosquitto~credential-5>
      - credential6=<secret:kv/data/workload/smarthome/mosquitto~credential-6>
      - credential7=<secret:kv/data/workload/smarthome/mosquitto~credential-7>
