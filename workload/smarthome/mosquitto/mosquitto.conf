persistence true
persistence_location /mosquitto/data
autosave_interval 1800

# TEMPORARY (phase 2b, wiki/06-todo/mosquitto-modernization.md): log every publish/subscribe so
# scripts/mosquitto-acl-usage.sh can build the per-user topic table from Loki. Topic names only,
# never payloads. Remove once the ACL roles are trimmed.
log_type all

# Auth + ACLs live in the dynamic-security plugin. Its state file sits on the PVC and is
# (re)built by reconcile.sh in the init container; users/roles can also be changed at
# runtime with mosquitto_ctrl (see wiki/02-smarthome/zigbee.md).
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Plaintext only: TLS for outside clients is terminated by Traefik (IngressRouteTCP, wildcard
# cert), so there is no cert/key to mount or reload here. Cluster-internal clients (HA,
# Zigbee2MQTT) and Shelly Gen1 / EMS-ESP / Moonraker use this listener directly.
listener 1883
