persistence true
persistence_location /mosquitto/data
autosave_interval 1800

# Default levels plus `debug`: the only level that logs "Denied PUBLISH" (an ACL violation is otherwise
# silent on MQTT 3.1.1; denied SUBSCRIBEs are never logged at any level). It also logs every received
# publish, and `subscribe` every subscription (topic names only, never payloads): they feed the
# Mosquitto dashboard and scripts/mosquitto-acl-usage.sh. Alert: "MQTT publish denied" (grafana-alerts/log-alerts.yaml).
log_type error
log_type warning
log_type notice
log_type information
log_type debug
log_type subscribe

# Auth + ACLs live in the dynamic-security plugin. Its state file sits on the PVC and is
# (re)built by reconcile.sh in the init container; users/roles can also be changed at
# runtime with mosquitto_ctrl (see wiki/02-smarthome/zigbee.md).
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Plaintext only: TLS for outside clients is terminated by Traefik (IngressRouteTCP, wildcard
# cert), so there is no cert/key to mount or reload here. Cluster-internal clients (HA,
# Zigbee2MQTT) and Shelly Gen1 / EMS-ESP / Moonraker use this listener directly.
listener 1883
