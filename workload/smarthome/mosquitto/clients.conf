# MQTT clients of the broker: who may log in and which topics they may touch.
# Read by reconcile.sh (init container) on every pod start; checked by scripts/mosquitto-clients-lint.sh.
# Passwords are never written here: each user points at a Vault key (no spaces in the value).
#
#   user <name> <password-placeholder> [readonly]
#     rw   <topic>   read and write
#     ro   <topic>   read only (subscribe + receive)
#     send <topic>   publish only
#   retired-user <name>   deletes that user (and its role) from the broker; never delete by just removing a block
#
# Topics may contain spaces and the MQTT wildcards. Lines starting with '#' are comments.
# Anything not listed is denied. Grants removed from this file are removed from the broker too.
# Adding a client: add a block here + `vault kv patch -mount=kv workload/smarthome/mosquitto <name>-password=<value>`.
# Users created at runtime with mosquitto_ctrl are never touched by this file.

user zigbee2mqtt <secret:kv/data/workload/smarthome/mosquitto~zigbee2mqtt-password>
  rw   zigbee2mqtt/#
  send homeassistant/#
  # HA birth message: Zigbee2MQTT re-publishes discovery when HA restarts
  ro   homeassistant/status

user homeAssistant <secret:kv/data/workload/smarthome/mosquitto~home-assistant-password>
  rw   homeassistant/#
  rw   zigbee2mqtt/#
  rw   shellies/#
  rw   ems-esp/#
  # automation publishing printer power readings, HA never reads them back
  send printers/#
  # discovery topics of native integrations HA subscribes to on every connect; nothing publishes there
  ro   drop_connect/discovery/#
  ro   dsmr/#
  ro   esphome/discover/#
  ro   fully/deviceInfo/+
  ro   inels/status/#
  ro   pglab/discovery/#
  ro   cloudapp/QBUSMQTTGW/#
  ro   tasmota/discovery/#
  ro   /greencell/broadcast/device
  ro   prism/hello

# One shared account for all Gen1 Shellies (per-device users would allow per-device topics).
user shelly <secret:kv/data/workload/smarthome/mosquitto~shelly-password>
  rw   shellies/#

user emsChip <secret:kv/data/workload/smarthome/mosquitto~ems-chip-password>
  rw   ems-esp/#
  send homeassistant/#

user moonraker <secret:kv/data/workload/smarthome/mosquitto~moonraker-password>
  rw   K1C-F1CE/#
  rw   kobra-ks1-0144/#
  # consumer of HA's printers/<name>/power
  ro   printers/#
  # the K1C reads its own plug's power from Zigbee2MQTT
  ro   zigbee2mqtt/Bureau plug 3D-printer K1C

# mosquitto-exporter: broker statistics only
user exporter <secret:kv/data/workload/smarthome/mosquitto-exporter~password> readonly
  ro   $SYS/#

# MQTT Explorer / troubleshooting
user debug <secret:kv/data/workload/smarthome/mosquitto~debug-password> readonly
  ro   #
  ro   $SYS/#
