# Music Assistant needs its own PV/PVC pair for the NFS music path: a PV binds to exactly one PVC and PVCs are
# namespaced, so the arr-stack ones (workload/arr-stack/shared/_storage.yaml) cannot be reused here.
# Mounted read-only in the container (readOnly in values.yaml). There is deliberately no PV for the Downloads share.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-assistant-library
  labels:
    type: local
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: <secret:kv/data/storage/nfs~server-ip>
    path: "<secret:kv/data/storage/nfs~music-path>"
    readOnly: true
  mountOptions:
    - vers=4.1
    - hard
    - ro
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-library
spec:
  resources:
    requests:
      storage: 1Ti
  volumeName: music-assistant-library
  storageClassName: ""
  accessModes:
    - ReadOnlyMany