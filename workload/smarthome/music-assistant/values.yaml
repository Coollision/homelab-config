fullnameOverride: music-assistant

# StatefulSet (not Deployment): /data is a RWO volume, so a rollout must never run two pods on it.
statefulset:
  image:
    repository: ghcr.io/music-assistant/server
    # Pin a stable 2.10.x tag. Beta 2.11.0b2 had a Sonos regression, and a downgrade after a database
    # migration is unsafe: back up /data (Longhorn snapshot) before bumping, see wiki/03-media-stack/music.md.
    tag: 2.10.5
  ports:
    web: 8095
    # Stream server: plain HTTP, no auth, by design. Sonos pulls audio from it, on the VLAN 5 leg below.
    # Never route this port through an ingress.
    stream: 8097

config:
  TZ: Europe/Brussels
  LOG_LEVEL: info

# Not officially supported on Kubernetes (the docs require host networking for mDNS/player access), so Sonos
# is reached through a MACVLAN leg on VLAN 5 (Intern), where the three players live.
# The default route stays on eth0 (cluster, NFS, ingress); sbr confines net1's DHCP routes to their own table.
# After the first start, Music Assistant must be told which address to hand to the players, otherwise it
# advertises the eth0 pod IP and Sonos cannot reach it:
#   Settings > Core > Streams (advanced) > Published IP address = the net1 address.
# Give that stub a UniFi alias and a fixed IP so the address never changes.
multusNetworks:
  - name: music-assistant-vlan5
    interface: net1
    mac: 02:05:67:9d:64:67
    dhcpHostname: _stub_music-assistant-lan
    parentInterface: vlan5
    nodeLabelKey: vlan5-trunk
    type: macvlan
    mode: bridge
    chainedPlugins:
      - type: sbr
    ipam:
      type: dhcp

# No official figures. A 4 GB Home Assistant Green was reported OOM-killed, and the first library sync is
# the heavy part (16 parallel tag reads). Watch it after the first scan and tune.
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# Internal only. No external ingress, and not scale-to-zero: Sonos and Home Assistant hold long-lived
# connections that a sleeping pod cannot answer.
ingress_internal_secure:
  host: music.<secret:kv/data/domains~domain>
  port: web

storage:
  # Database, settings, provider credentials (Spotify), cache. Playlists, favourites and play counts live
  # only here, so it is protected.
  - type: longhorn
    mountPath: /data
    size: 5Gi
    nameSuffix: data
    volumeName: music-assistant
    protect: true
  # Legacy library (flat, one folder per album), read-only. PV/PVC in templates/storage.yaml.
  - type: existingClaim
    mountPath: /media/music
    claimName: music-assistant-library
    nameSuffix: library
    readOnly: true
  # New downloads: only the slskd subfolder of the Downloads share (the share also holds video downloads).
  - type: existingClaim
    mountPath: /media/downloads
    claimName: music-assistant-downloads
    nameSuffix: downloads
    subPath: slskd
    readOnly: true

probes:
  startup:
    tcpSocket:
      port: web
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    tcpSocket:
      port: web
    periodSeconds: 10
  liveness:
    tcpSocket:
      port: web
    periodSeconds: 30
    failureThreshold: 5
