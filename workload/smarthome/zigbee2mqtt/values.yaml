fullnameOverride: zigbee2mqtt
statefulset:
  image:
    repository: koenkk/zigbee2mqtt
    tag: 2.14.3
  ports:
    web: 8080
config:
  TZ: Europe/Brussels
  ZIGBEE2MQTT_DATA: /data

ingress_internal_secure:
  host: zigbee2mqtt.<secret:kv/data/shared/domains~domain>
  port: web
ingress_internal:
  host: zigbee2mqtt.<secret:kv/data/shared/domains~local>
  port: web

homepage:
  group: Smart Home
  icon: zigbee2mqtt
  description: Zigbee mesh
storage:
  - mountPath: /data
    type: longhorn
    volumeName: zigbee2mqtt
    storageClass: longhorn-shared
    size: 128Mi
    protect: true

resources:
  requests:
    cpu: 10m
    memory: 160Mi
  limits:
    cpu: 200m
    memory: 224Mi

# The coordinator is a PoE adapter over TCP now, so the pod can run anywhere. Soft preference for the mini nodes:
# the VM node has known disk-I/O hangs.
affinity:
  node:
    preferred:
      - weight: 100
        matchExpressions:
          - key: type
            operator: In
            values: ["mini"]
# Singleton coordinator: keep the descheduler from bouncing it between mini nodes (it honours this label).
podLabels:
  preventDeschedule: "true"
