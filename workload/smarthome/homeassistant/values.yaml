fullnameOverride: homeassistant
statefulset:
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: 2026.8.0
  ports:
    web: 8123
config:
  TZ: Europe/Brussels
resources:
  requests:
    cpu: 50m
    memory: 2560Mi
  limits:
    cpu: 1000m
    memory: 3584Mi
securityContext:
  capabilities:
    add:
      - NET_RAW
      - NET_ADMIN

initContainers:
  - name: setup-thread-route
    image: busybox:1.38
    command:
      - sh
      - -c
      - |
        sleep 5
        # Route to the Thread mesh (OTBR's OMR prefix, a ULA it generates and persists
        # itself, so it is unaffected by ISP prefix changes).
        #
        # The next hop MUST be a link-local address. This previously used the border
        # router's global VLAN40 address (2a02:a03f:f412:d601:...), which silently died
        # when the ISP rotated the delegated prefix to 2a02:a03f:e41f::/48 — `|| true`
        # swallowed the failure and HA lost all direct Thread reachability. Link-local is
        # derived from the interface MAC, which is pinned in the border router's Multus
        # config (02:05:67:9d:64:64 on VLAN5 -> fe80::5:67ff:fe9d:6464), so it survives
        # any renumbering. Use the VLAN5 address because that is the link this pod's net2
        # actually shares with the border router.
        ip -6 route replace fd77:3621:418:1::/64 via fe80::5:67ff:fe9d:6464 dev net2 || true
        ip -6 route get fd77:3621:418:1::1 || echo "WARNING: thread route not installed"

        # Sonos host routes. The sbr chained plugin parks net2's routes in table
        # 100, which is only consulted for traffic ALREADY sourced from net2's
        # address, so a destination lookup for a VLAN5 host falls through to the
        # eth0 default route and HA sources it from the pod IP. SoCo derives its
        # UPnP event-listener bind address from that source IP (get_listen_ip()
        # does a UDP connect to the speaker and reads the local address), so it
        # binds and advertises 10.42.x.x — unreachable from the speakers. Every
        # subscription then fails and the integration silently degrades to
        # polling ("Subscription to <speaker> failed, attempting to poll
        # directly"). A host route per speaker makes net2 the egress, so the
        # listener binds 192.168.5.x and callbacks arrive over the shared L2.
        #
        # Deliberately /32 per speaker, NOT the whole 192.168.5.0/24: a blanket
        # route would also capture HA's replies to Traefik (a VLAN5 address in
        # http.trusted_proxies), pushing them out net2 asymmetrically.
        #
        # The speakers hold fixed addresses, so these routes are stable; if one
        # is ever renumbered its route goes stale and Sonos quietly falls back
        # to polling rather than failing loudly.
        for speaker in 192.168.5.40 192.168.5.42 192.168.5.43; do
          ip route replace "$speaker/32" dev net2 || echo "WARNING: no route for $speaker"
        done
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        add:
          - NET_ADMIN

ingress_internal:
  host: homeassistant.<secret:kv/data/domains~local>
  port: web
ingress_internal_secure:
  host: homeassistant.<secret:kv/data/domains~domain>
  port: web
ingress_external_secure:
  host: homeassistant.<secret:kv/data/domains~domain>
  port: web
storage:
  - mountPath: /config
    size: 2Gi
    type: longhorn
    volumeName: homeassistant
    nameSuffix: config
    storageClass: longhorn-shared
    protect: true

multusNetworks:
  - name: homeassistant-vlan5
    interface: net2
    # Was 02:40:67:9d:64:65 — a VLAN40 prefix on a VLAN5 interface. Harmless on
    # the wire, but the second octet is what makes a stub identifiable at a glance
    # in UniFi's client list, so it has to be honest. Scheme: see _multus.yaml.
    mac: 02:05:67:9d:64:65
    dhcpHostname: _stub_homeassistant-lan
    parentInterface: vlan5
    nodeLabelKey: vlan5-trunk
    type: macvlan
    mode: bridge
    chainedPlugins:
      - type: sbr
    ipam:
      type: dhcp
      routes:
        - dst: "::/0"
          gw: ""

hostNetwork: false
dnsPolicy: ClusterFirst
imagePreSync: true
serviceIp: <secret:kv/data/smarthome/homeassistant~ip>
probes:
  liveness:
    httpGet:
      path: /
      port: web
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    httpGet:
      path: /
      port: web
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

labels:
  app.kubernetes.io/component: homeassistant

# No DB co-location affinity: the recorder moves to CNPG (smarthome-db-pg), whose pod can
# reschedule on failover, and same-node latency is negligible on the LAN for this workload.
# HA placement is driven by its vlan5-trunk macvlan node requirement instead.
