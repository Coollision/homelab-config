---
vlan_trunk_interfaces: []
vlan_trunk_validate_network_manager: true
vlan_trunk_expected_network_manager: auto
vlan_trunk_fail_when_networkmanager_active: true

vlan_trunk_enable_thread_ipv6: true
vlan_trunk_thread_interfaces: ["vlan40"]


# Router advertisements on the VLAN sub-interfaces must not install an IPv6 default
# route: the VLANs (IoT, Intern) are not internet paths, and with equal-metric
# defaults the kernel can pick one for egress (image pulls and other outbound IPv6
# then time out). Only the parent (uplink) interface keeps its default route.
# on-link addresses and Thread route info (accept_ra_rt_info_max_plen) are unaffected.
# Covers the ifupdown path; the networkd and NetworkManager branches are not handled.
vlan_trunk_ra_default_route: false
