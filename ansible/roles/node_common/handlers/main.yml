- name: Update-locale
  become: true
  ansible.builtin.command: "update-locale LANG={{ system_locale }}"
  changed_when: true

- name: Update-udev1
  become: true
  ansible.builtin.command: "udevadm control --reload-rules"
  changed_when: true

- name: Update-udev2
  become: true
  ansible.builtin.command: "udevadm trigger"
  changed_when: true
