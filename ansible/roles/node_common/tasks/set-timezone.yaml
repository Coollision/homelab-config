- name: Set the system timezone (only when system_timezone is set)
  become: true
  ansible.builtin.timezone:
    name: "{{ system_timezone }}"
  when: system_timezone is defined

- name: Ensure the system locale exists (only when system_locale is set)
  become: true
  ansible.builtin.locale_gen:
    name: "{{ system_locale }}"
    state: present
  when: system_locale is defined
  notify:
    - Update-locale

- name: Set default system locale
  become: true
  ansible.builtin.debconf:
    name: 'locales'
    question: 'locales/default_environment_locale'
    vtype: 'string'
    value: '{{ system_locale }}'
  when: system_locale is defined
  notify:
    - Update-locale
