# The ONE place the inotify limits are persisted (values: defaults/main.yml).
# roles/node_update's distro preflight reuses it via include_role tasks_from.
# /etc/sysctl.d, not /etc/sysctl.conf: Debian 13 no longer reads sysctl.conf, so the
# limits silently reset to the kernel default (128 instances) after the distro upgrade.
- name: Persist inotify limits in /etc/sysctl.d
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    sysctl_set: true
    reload: true
  loop: >-
    {{ {'fs.inotify.max_user_instances': node_common_inotify_max_user_instances,
        'fs.inotify.max_user_watches': node_common_inotify_max_user_watches} | dict2items }}

# bookworm also reads /etc/sysctl.conf, AFTER 99-inotify.conf (via the
# 99-sysctl.conf symlink), so stale lines there would win. Drop them.
- name: Remove stale inotify lines from /etc/sysctl.conf
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^\s*fs\.inotify\.max_user_(instances|watches)\s*='
    state: absent
