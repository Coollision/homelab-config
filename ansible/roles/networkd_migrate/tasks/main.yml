---
- name: Networkd migrate - phase must be known
  ansible.builtin.assert:
    that: networkd_migrate_phase in ['stage', 'cutover', 'finish', 'verify', 'revert', 'cleanup']
    fail_msg: "networkd_migrate_phase must be stage, cutover, finish, verify, revert or cleanup (got {{ networkd_migrate_phase }})."

- name: Networkd migrate - stage
  ansible.builtin.include_tasks: stage.yml
  when: networkd_migrate_phase == 'stage'

- name: Networkd migrate - cutover
  ansible.builtin.include_tasks: cutover.yml
  when: networkd_migrate_phase == 'cutover'

- name: Networkd migrate - finish
  ansible.builtin.include_tasks: finish.yml
  when: networkd_migrate_phase == 'finish'

- name: Networkd migrate - verify
  ansible.builtin.include_tasks: verify.yml
  when: networkd_migrate_phase == 'verify'

- name: Networkd migrate - revert
  ansible.builtin.include_tasks: revert.yml
  when: networkd_migrate_phase == 'revert'

- name: Networkd migrate - cleanup
  ansible.builtin.include_tasks: cleanup.yml
  when: networkd_migrate_phase == 'cleanup'
