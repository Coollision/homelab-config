---
- name: Ensure required DNS variables are defined
  ansible.builtin.assert:
    that:
      - dns_key_name is defined
      - dns_key_secret is defined
      - dns_server_ip is defined
      - dns_zone_name is defined
    fail_msg: "Missing required DNS variables: dns_key_name, dns_key_secret, dns_server_ip, dns_zone_name (set them in the private inventory)."
    quiet: true

- name: Add records to DNS
  become: false
  community.general.nsupdate:
    key_name: "{{ dns_key_name }}"
    key_secret: "{{ dns_key_secret }}"
    server: "{{ dns_server_ip }}"
    zone: "{{ dns_zone_name }}"
    record: '{{ dns_set_record | regex_replace("\." + dns_zone_name + "$", "") }}'
    value: "{{ dns_set_record_value }}"
    ttl: 3600
    type: "{{ dns_record_type }}"
  delegate_to: localhost
  no_log: true
