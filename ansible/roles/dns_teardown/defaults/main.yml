---
# dns_key_name, dns_key_secret, dns_server_ip and dns_zone_name have NO defaults on
# purpose: they must come from the private inventory (the role fails without them).
# Callers pass dns_teardown_record (+ dns_teardown_record_value). The type follows the
# dns role's dns_record_type (inventory group_vars) unless overridden.
dns_teardown_record_type: "{{ dns_record_type | default('A') }}"
