---
- name: Copy K3s service file
  ansible.builtin.template:
    src: "k3s.service.j2"
    dest: "{{ systemd_dir }}/k3s.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

# KillMode=process must be its own line: when it was glued onto ExecStart (old template), systemd ignored it and a
# k3s restart killed every container on the node (Longhorn engines included, 2026-10-31).
- name: Guard - KillMode=process is a standalone line in the k3s unit
  ansible.builtin.command: grep -qxF KillMode=process "{{ systemd_dir }}/k3s.service"
  changed_when: false
  check_mode: false

- name: Flag k3s restart when the binary or registries changed (k3s_pre)
  ansible.builtin.debug:
    msg: "k3s binary or registries.yaml changed; k3s will be restarted"
  changed_when: true
  notify: Restart k3s
  when: k3s_pre_restart_needed | default(false) | bool

- name: Enable and start K3s service
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    state: started
    enabled: true

# Apply a pending config/binary restart now, before the token is read or the
# next node joins, instead of at the end of the play.
- name: Restart k3s now if anything changed
  ansible.builtin.meta: flush_handlers
