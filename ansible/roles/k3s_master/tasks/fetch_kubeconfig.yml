---
# Fetches the primary's admin kubeconfig to a gitignored scratch file under
# ansible/kubeconfig/, rewrites server + names, merges it into ~/.kube/config
# and deletes the scratch file again.
- name: Set local kubeconfig scratch path
  ansible.builtin.set_fact:
    k3s_master_kubeconfig_tmp: "{{ (playbook_dir ~ '/../kubeconfig/' ~ (k3s_cluster_name | default('k3s')) ~ '.yaml') | realpath }}"
    k3s_master_kube_name: "{{ k3s_cluster_name | default('k3s') }}"

- name: Ensure local kubeconfig scratch directory exists
  become: false
  ansible.builtin.file:
    path: "{{ k3s_master_kubeconfig_tmp | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_master_kubeconfig_tmp }}"
    flat: true
  run_once: true

- name: Restrict local kubeconfig scratch file
  become: false
  ansible.builtin.file:
    path: "{{ k3s_master_kubeconfig_tmp }}"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: Fix kubeconfig server address
  become: false
  ansible.builtin.replace:
    path: "{{ k3s_master_kubeconfig_tmp }}"
    regexp: '(server:\s*https://)127\.0\.0\.1(:6443)'
    replace: '\g<1>{{ k3s_master_domain_name }}\g<2>'
  delegate_to: localhost
  run_once: true

# Only rewrite the name/cluster/user/current-context keys whose value is
# exactly "default" (the k3s defaults), not every occurrence of the word.
- name: Fix kubeconfig cluster/context/user names
  become: false
  ansible.builtin.replace:
    path: "{{ k3s_master_kubeconfig_tmp }}"
    regexp: '^(\s*(?:-\s+)?(?:name|cluster|user|current-context):\s*)default\s*$'
    replace: '\g<1>{{ k3s_master_kube_name }}'
  delegate_to: localhost
  run_once: true

- name: Ensure ~/.kube directory exists
  become: false
  ansible.builtin.file:
    path: ~/.kube
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Check if local kubeconfig exists
  become: false
  ansible.builtin.stat:
    path: ~/.kube/config
  register: k3s_master_local_kubeconfig
  delegate_to: localhost
  run_once: true

- name: Create empty kubeconfig if it doesn't exist
  become: false
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Config
      clusters: []
      contexts: []
      users: []
    dest: ~/.kube/config
    mode: "0600"
  when: not k3s_master_local_kubeconfig.stat.exists
  delegate_to: localhost
  run_once: true

- name: Remove existing cluster/context/user entries (to overwrite)
  become: false
  ansible.builtin.shell:
    cmd: |
      kubectl config delete-context "{{ k3s_master_kube_name }}" 2>/dev/null || true
      kubectl config delete-cluster "{{ k3s_master_kube_name }}" 2>/dev/null || true
      kubectl config delete-user "{{ k3s_master_kube_name }}" 2>/dev/null || true
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Merge kubeconfig into local config
  become: false
  ansible.builtin.shell:
    cmd: |
      set -e
      KUBECONFIG="$HOME/.kube/config:{{ k3s_master_kubeconfig_tmp }}" kubectl config view --merge --flatten > "$HOME/.kube/config.tmp"
      chmod 600 "$HOME/.kube/config.tmp"
      mv "$HOME/.kube/config.tmp" "$HOME/.kube/config"
  changed_when: true
  delegate_to: localhost
  run_once: true

- name: Set new cluster as current context
  become: false
  ansible.builtin.command:
    cmd: kubectl config use-context "{{ k3s_master_kube_name }}"
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Clean up temporary kubeconfig
  become: false
  ansible.builtin.file:
    path: "{{ k3s_master_kubeconfig_tmp }}"
    state: absent
  delegate_to: localhost
  run_once: true
