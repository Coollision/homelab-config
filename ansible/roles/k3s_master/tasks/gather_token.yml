---
- name: Wait for node-token
  ansible.builtin.wait_for:
    path: "/var/lib/rancher/k3s/server/node-token"

- name: Read node-token from master
  ansible.builtin.slurp:
    path: "/var/lib/rancher/k3s/server/node-token"
  register: k3s_master_node_token
  no_log: true

- name: Validate node-token exists and is not empty
  ansible.builtin.fail:
    msg: "Node token is missing or empty. K3s may not be properly installed on master node."
  when:
    - k3s_master_node_token.content is not defined or k3s_master_node_token.content | b64decode | trim == ""

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Create crictl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/crictl
    state: link
