---
# Shared "stable run" gate used by node_update after touching a node. Waits
# until every pod scheduled on the node has settled AND every Longhorn volume
# cluster-wide is back to Healthy before the calling playbook moves on to the
# next node — deliberately a hard barrier between nodes, not just a courtesy
# check, so two nodes' worth of Longhorn replica-rebuild I/O never overlaps.
#
# Inputs: see meta/argument_specs.yml (only k3s_node_name is required; the
# budgets default in defaults/main.yml, cluster_wait_stable_distro_heal_retries replaces the heal
# retries when cluster_wait_stable_distro_active).

- name: "Node's last Ready transition (pods that failed before it are leftovers) [{{ k3s_node_name }}]"
  ansible.builtin.command: >
    kubectl --context {{ cluster_wait_stable_kubectl_context }} get node {{ k3s_node_name }}
    -o 'jsonpath={.status.conditions[?(@.type=="Ready")].lastTransitionTime}'
  delegate_to: localhost
  become: false
  register: cluster_wait_stable_node_ready_since
  changed_when: false

- name: "Wait for pods on this node to settle (Running/Succeeded) [{{ k3s_node_name }}]"
  # Not counted as unsettled: pods already being deleted (deletionTimestamp),
  # and Failed pods (e.g. Evicted, Shutdown) created before the node's last
  # Ready transition, i.e. leftovers from before the reboot that nothing will
  # ever restart. RFC 3339 UTC timestamps compare correctly as strings.
  # NOT `grep -v ... | wc -l`: grep exits 1 when it finds zero matching
  # lines — which is exactly the success case here (zero unsettled pods) —
  # so under pipefail the pipeline hard-fails at the exact moment it
  # succeeds. Confirmed live: rc=1 with the correct stdout "0" already in
  # hand. jq has no such exit-code quirk for a plain select(), same pattern
  # as the Longhorn check below.
  ansible.builtin.shell: >
    set -o pipefail &&
    kubectl --context {{ cluster_wait_stable_kubectl_context }} get pods -A
    --field-selector spec.nodeName={{ k3s_node_name }} -o json |
    jq -r --arg since '{{ cluster_wait_stable_node_ready_since.stdout }}' '.items[]
    | select(.metadata.deletionTimestamp == null)
    | select(.status.phase != "Running" and .status.phase != "Succeeded")
    | select((.status.phase == "Failed" and $since != "" and .metadata.creationTimestamp < $since) | not)
    | (.metadata.namespace + "/" + .metadata.name + ": " + .status.phase + (if .status.reason then " (" + .status.reason + ")" else "" end))'
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: cluster_wait_stable_unsettled_pods
  until: cluster_wait_stable_unsettled_pods.stdout_lines | length == 0
  retries: "{{ cluster_wait_stable_stabilize_retries }}"
  delay: "{{ cluster_wait_stable_stabilize_delay }}"
  changed_when: false

# Own retry budget: a reboot degrades every 3-replica volume that had a copy
# here, and rebuilds take a lot longer than pods settling.
- name: "Wait for no Longhorn volumes to be degraded/faulted (own budget) [{{ k3s_node_name }}]"
  # Not "== Healthy" for all: some volumes sit at "unknown" long-term when their
  # workload is scaled to zero (Sablier) and nothing has it attached — that's
  # normal, not a stability blocker. Only degraded/faulted actually matters here.
  # Lists the actual volumes, not just a count, so a timeout failure shows
  # exactly what's still rebuilding instead of a bare "task failed".
  ansible.builtin.shell: >
    set -o pipefail &&
    kubectl --context {{ cluster_wait_stable_kubectl_context }} get volumes.longhorn.io -A -o json |
    jq -r '.items[] | select((.status.robustness | ascii_downcase) as $r | $r == "degraded" or $r == "faulted")
    | (.metadata.namespace + "/" + .metadata.name + ": " + .status.robustness)'
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: cluster_wait_stable_unhealthy_volumes
  until: cluster_wait_stable_unhealthy_volumes.stdout_lines | length == 0
  retries: >-
    {{ cluster_wait_stable_distro_heal_retries | default(cluster_wait_stable_longhorn_heal_retries)
       if (cluster_wait_stable_distro_active | default(false) | bool) else cluster_wait_stable_longhorn_heal_retries }}
  delay: "{{ cluster_wait_stable_longhorn_heal_delay }}"
  changed_when: false

- name: "Node confirmed stable [{{ k3s_node_name }}]"
  ansible.builtin.debug:
    msg: "{{ k3s_node_name }}: pods settled, all Longhorn volumes Healthy."
