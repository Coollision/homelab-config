---
- name: Read installed k3s version
  ansible.builtin.command: "{{ k3s_server_location | default('/usr/local/bin/k3s') }} --version"
  register: k3s_pre_installed
  changed_when: false
  failed_when: false

- name: Refuse to downgrade k3s
  vars:
    _installed: "{{ k3s_pre_installed.stdout | default('') | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}"
    _norm_installed: "{{ _installed | regex_replace('^v', '') | regex_replace('\\+k3s', '.') }}"
    _norm_target: "{{ k3s_version | default('') | regex_replace('^v', '') | regex_replace('\\+k3s', '.') }}"
  ansible.builtin.assert:
    that:
      - (k3s_allow_downgrade | default(false) | bool) or not _installed or (_norm_installed is version(_norm_target, '<='))
    fail_msg: >-
      Installed k3s {{ _installed }} is newer than k3s_version {{ k3s_version | default('<undefined>') }}.
      Bump k3s_version in the private inventory, or pass -e k3s_allow_downgrade=true if you really mean it.
    quiet: true
  when: k3s_pre_installed.rc == 0

- name: Download k3s binary
  ansible.builtin.include_tasks: download.yml

- name: Load dm_crypt kernel module
  community.general.modprobe:
    name: dm_crypt
    state: present

- name: Persist dm_crypt kernel module on boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/dm_crypt.conf
    line: dm_crypt
    create: true
    mode: "0644"

- name: Creates k3s config dir
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Setup custom registries
  ansible.builtin.template:
    dest: "/etc/rancher/k3s/registries.yaml"
    src: "registries.yaml.j2"
    owner: root
    group: root
    mode: "0600"
  register: k3s_pre_registries
  no_log: true

# Consumed by k3s_master / k3s_worker: restart k3s (via handler) only when
# the binary or registries actually changed.
- name: Record whether k3s needs a restart
  ansible.builtin.set_fact:
    k3s_pre_restart_needed: >-
      {{ (k3s_pre_dl_amd64 is changed) or (k3s_pre_dl_arm64 is changed)
         or (k3s_pre_dl_armhf is changed) or (k3s_pre_registries is changed) }}
