---
host_ip_address: 192.0.2.10
host_ipv6_address: "2001:db8::10"
ansible_user: user
dns_record_name: node-gn.example.internal
dns_record_value: "{{ host_ip_address }}"
ansible_python_interpreter: /usr/bin/python3

k3s_node_name: master-gn
k3s_flannel_iface: uplink0

k3s_node_label:
  - kubefledged.io/cache=true
  - type=mini
  - node.longhorn.io/create-default-disk=config
  - vlan40-trunk=true
  - vlan5-trunk=true

vlan_trunk_interfaces:
  - id: 40
    parent_interface: uplink0
    interface_name: vlan40
  - id: 5
    parent_interface: uplink0
    interface_name: vlan5

k3s_node_annotations:
  node.longhorn.io/default-disks-config: '[{"path":"/mnt/longhorn","allowScheduling":true,"tags":["fast"],"storageReserved":53687091200}]'

# Stable path; mounted by UUID. Only formatted when empty AND allow_format is true.
longhorn_disk_device: /dev/disk/by-id/nvme-EXAMPLE-SERIAL-part3
# longhorn_disk_allow_format: false
