---
# ifupdown -> systemd-networkd, one node at a time (docs: wiki/01-platform/networking.md#network-stack).
#   stage:   ansible-playbook playbooks/networkd_migrate.yml --limit <node> --check --diff   (then without --check)
#   cutover: ansible-playbook playbooks/networkd_migrate.yml --limit <node> -e networkd_migrate_phase=cutover -e networkd_migrate_confirm=<node>
#   verify:  ansible-playbook playbooks/networkd_migrate.yml --limit <node> -e networkd_migrate_phase=verify
#   revert:  ... -e networkd_migrate_phase=revert -e networkd_migrate_confirm=<node>
#   cleanup: ... -e networkd_migrate_phase=cleanup -e networkd_migrate_confirm=<node>
# Order: VM node, then the VLAN/Multus node (drain it first), the control-plane node last.
# The cutover reboots the node. It does NOT drain: do that yourself where it matters.
# Takes the cluster-side maintenance lock (ConfigMap
# kube-system/homelab-node-maintenance-lock, shared with cluster_update.yml and
# distro_upgrade.yml). Released only on success; after a failure check the
# nodes, then re-run with -e maint_lock_break=true.

- name: "Networkd migrate - lock"
  hosts: k3scluster
  gather_facts: false
  tasks:
    - name: Take the maintenance lock (only checked under --check)
      ansible.builtin.include_role:
        name: node_update
        tasks_from: maint_lock
        apply:
          delegate_to: localhost
          run_once: true
      vars:
        node_update_maint_lock_action: "{{ 'check' if ansible_check_mode else 'acquire' }}"
        node_update_maint_lock_playbook: networkd_migrate
      run_once: true  # noqa: run-once[task]

- name: Move a node from ifupdown to systemd-networkd
  hosts: k3scluster
  # A failure on any node stops the run so the release play never frees the lock.
  any_errors_fatal: true
  become: true
  gather_facts: false
  roles:
    - networkd_migrate

- name: "Networkd migrate - release lock"
  hosts: k3scluster
  gather_facts: false
  tasks:
    - name: Release the maintenance lock
      ansible.builtin.include_role:
        name: node_update
        tasks_from: maint_lock
        apply:
          delegate_to: localhost
          run_once: true
      vars:
        node_update_maint_lock_action: release
        node_update_maint_lock_playbook: networkd_migrate
      run_once: true  # noqa: run-once[task]
      when: not ansible_check_mode
