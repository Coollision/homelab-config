---
# Careful, one-node-at-a-time OS + k3s upgrade for the whole cluster.
# Each node gets exactly ONE cordon -> drain -> uncordon cycle covering
# BOTH the OS/kernel dist-upgrade and the k3s binary bump — no double
# eviction of pods for two separate passes.
#
# Safe by default: node_update_dry_run defaults to true, so a plain run only reports
# what apt/k3s would change, plus any bare-pod/PDB drain blockers — nothing
# is cordoned, drained, upgraded or rebooted. Pass -e node_update_dry_run=false to apply.
#
# Node order: master first, then workers. With only one control-plane node
# there's no HA benefit to doing workers first anymore now that the k3s
# version bump travels with the OS patch in the same pass — and k3s's own
# upgrade guidance is servers before agents, so that rule wins here.
#
# Usage:
#   Report only (safe, default):
#     ansible-playbook playbooks/cluster_update.yml
#
#   Real run, everything:
#     ansible-playbook playbooks/cluster_update.yml -e node_update_dry_run=false
#
#   Real run, OS/kernel packages only (skip the k3s version bump):
#     ansible-playbook playbooks/cluster_update.yml -e node_update_dry_run=false -e node_update_upgrade_k3s=false
#
#   Real run, k3s binary only (skip OS packages):
#     ansible-playbook playbooks/cluster_update.yml -e node_update_dry_run=false -e node_update_patch_os=false
#
#   Test against a single node first:
#     ansible-playbook playbooks/cluster_update.yml -e node_update_dry_run=false --limit <node>
#
#   A stuck drain (bare pod with no controller) is refused, NOT forced, and
#   the node is automatically uncordoned again on failure — see roles/node_update.
#   Only pass -e node_update_force_drain=true once you've confirmed those pods are fine
#   to lose permanently.
#
# If nothing is pending on a node (OS already current AND k3s already on
# k3s_version) that node is skipped entirely: it is never cordoned for a
# no-op. Exception: a node that is already cordoned (e.g. a previous
# node_update_keep_cordoned run) gets an uncordon-only pass instead of staying cordoned.
#
# k3s_version lives in the private inventory group_vars and is shared with
# k3s_setup.yml, so fresh installs and upgrades always agree; bump it there.
# kubectl runs on the controller against -e node_update_kubectl_context=<ctx> (default:
# the host's k3s_cluster_name, else "k3s").
#
# Real runs take the cluster-side maintenance lock (ConfigMap
# kube-system/homelab-node-maintenance-lock), shared with distro_upgrade.yml,
# so the two can never run at once. Released only on success; after a
# failure check the nodes, then re-run with -e maint_lock_break=true.
#
# A Debian release upgrade is a separate playbook (distro_upgrade.yml). A k3s
# version bump is never done inside the distro-upgrade drain: run it here as
# its own pass, before or after the distro upgrade.

- name: "Cluster update - lock"
  hosts: k3scluster
  gather_facts: false
  tasks:
    - name: Take the maintenance lock
      ansible.builtin.include_role:
        name: node_update
        tasks_from: maint_lock
        apply:
          delegate_to: localhost
          run_once: true  # noqa: run-once[task] -- plays use the default linear strategy
      vars:
        node_update_maint_lock_action: acquire
        node_update_maint_lock_playbook: cluster_update
      run_once: true  # noqa: run-once[task] -- plays use the default linear strategy
      when: not (node_update_dry_run | default(true) | bool)

- name: "Cluster update - master (server first)"
  hosts: k3smaster
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - node_update

- name: "Cluster update - workers (agents last)"
  hosts: k3sworkers
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - node_update

- name: "Cluster update - release lock"
  hosts: k3scluster
  gather_facts: false
  tasks:
    - name: Release the maintenance lock
      ansible.builtin.include_role:
        name: node_update
        tasks_from: maint_lock
        apply:
          delegate_to: localhost
          run_once: true  # noqa: run-once[task] -- plays use the default linear strategy
      vars:
        node_update_maint_lock_action: release
        node_update_maint_lock_playbook: cluster_update
      run_once: true  # noqa: run-once[task] -- plays use the default linear strategy
      when: not (node_update_dry_run | default(true) | bool)
