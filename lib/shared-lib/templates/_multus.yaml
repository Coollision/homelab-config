{{- define "shared-lib.multusNetworkNamesCsv" -}}
{{- /* Multus NetworkAttachmentDefinition Helper Functions

This template set provides flexible Multus secondary network configuration with support for:
- IPv4 DHCP (default)
- IPv6 DHCP via routes configuration (see example below)
- Chained CNI plugins (sbr for source-based routing, tuning for MAC/MTU)

IPv6 DHCP Example - Add to multusNetworks in values.yaml:
  multusNetworks:
    - name: example-vlan-ipv6
      interface: net1
      parentInterface: vlan40
      type: macvlan
      mode: bridge
      ipam:
        type: dhcp
        routes:
          - dst: "::/0"          # Request IPv6 route to enable DHCPv6
            gw: ""               # Gateway will be learned from DHCPv6
      chainedPlugins:
        - type: sbr              # Enable source-based routing for multiple NICs

MAC + DHCP-hostname allocation (`mac:` / `dhcpHostname:`)
---------------------------------------------------------
Every macvlan attachment puts a NIC on a real VLAN, so each one shows up in UniFi's
client list as its own device. Both fields exist to make that entry identifiable and
stable; neither is optional on a new attachment.

  mac:           02:<vlan>:67:9d:64:<app>   locally-administered (02: prefix)
                   <vlan> = the VLAN tag, written as-is (05, 40)
                   <app>  = one id per workload, SHARED across its VLANs
                            61 mdns-reflector  63 matter-server  64 thread-border-router
                            65 homeassistant   66 esphome
                 The DNS cluster predates this and uses its own 02:53:00:00:00:<n>.

  dhcpHostname:  _stub_<workload>-<iot|lan>   sent as DHCP option 12 (host-name)

Two rules the scheme depends on:

  1. MACs must be globally unique across the homelab, not just per-VLAN. Two stubs on
     different VLANs may share a MAC quite happily on the wire, but UniFi keys clients
     on the MAC alone, so they merge into one flip-flopping entry that can be neither
     named nor given a fixed lease. Pin the workload id in the last octet and let the
     second octet carry the VLAN and that cannot happen.
  2. Pinning the MAC also pins the IPv6 link-local / SLAAC interface ID (EUI-64), which
     several routes are written against by hand — e.g. the border router's
     02:05:67:9d:64:64 is the fe80::5:67ff:fe9d:6464 next hop in homeassistant's
     initContainer. grep for the EUI-64 form before renumbering anything.

Changing a `mac:` costs a new DHCP lease, so the UniFi fixed-IP reservation and client
alias have to be re-pointed at the new address in the same change.
*/ -}}
{{- $names := list -}}
{{- range $network := .Values.multusNetworks -}}
{{- if not $network.name -}}
{{- "multusNetworks entry missing required field: name" | fail -}}
{{- end -}}
{{- $names = append $names $network.name -}}
{{- end -}}
{{- join ", " $names -}}
{{- end -}}

{{- define "shared-lib.multusNetworkSelectionElement" -}}
{{- $network := . -}}
{{- if not $network.name -}}
{{- "multusNetworks entry missing required field: name" | fail -}}
{{- end -}}
{{- $element := dict "name" $network.name -}}
{{- if $network.namespace -}}
{{- $_ := set $element "namespace" $network.namespace -}}
{{- end -}}
{{- if $network.interface -}}
{{- $_ := set $element "interface" $network.interface -}}
{{- end -}}
{{- if $network.mac -}}
{{- $_ := set $element "mac" $network.mac -}}
{{- end -}}
{{- if $network.ips -}}
{{- $_ := set $element "ips" $network.ips -}}
{{- end -}}
{{- if $network.defaultRoute -}}
{{- $_ := set $element "default-route" $network.defaultRoute -}}
{{- end -}}
{{- if $network.cniArgs -}}
{{- $_ := set $element "cni-args" $network.cniArgs -}}
{{- end -}}
{{- $element | toJson -}}
{{- end -}}

{{- define "shared-lib.multusNetworkAnnotation" -}}
{{- $attachments := list -}}
{{- $hasOverrides := false -}}
{{- range $network := .Values.multusNetworks -}}
{{- if or $network.namespace $network.interface $network.mac $network.ips $network.defaultRoute $network.cniArgs -}}
{{- $hasOverrides = true -}}
{{- end -}}
{{- $attachments = append $attachments (include "shared-lib.multusNetworkSelectionElement" $network | fromJson) -}}
{{- end -}}
{{- if $hasOverrides -}}
{{- $attachments | toJson -}}
{{- else -}}
{{- include "shared-lib.multusNetworkNamesCsv" . -}}
{{- end -}}
{{- end -}}

{{- define "shared-lib.multusNads" -}}
{{- $root := . -}}
{{- range $index, $network := .Values.multusNetworks }}
{{- if not $network.name -}}
{{- "multusNetworks entry missing required field: name" | fail -}}
{{- end -}}
{{- if not $network.parentInterface -}}
{{- printf "multusNetworks[%d] missing required field: parentInterface" $index | fail -}}
{{- end -}}
{{- $ipam := mergeOverwrite (dict "type" (default "dhcp" $network.ipam.type)) ($network.ipam | default dict) -}}
{{- if and $network.dhcpHostname $network.dhcpHostnameFromPodName -}}
{{- printf "multusNetworks[%d] cannot set both dhcpHostname and dhcpHostnameFromPodName" $index | fail -}}
{{- end -}}
{{- $provide := list -}}
{{- if $ipam.provide -}}
{{- $provide = concat $provide $ipam.provide -}}
{{- end -}}
{{- if $network.dhcpHostname -}}
{{- $provide = append $provide (dict "option" "host-name" "value" $network.dhcpHostname) -}}
{{- end -}}
{{- if $network.dhcpHostnameFromPodName -}}
{{- $provide = append $provide (dict "option" "host-name" "fromArg" "K8S_POD_NAME") -}}
{{- end -}}
{{- if gt (len $provide) 0 -}}
{{- $_ := set $ipam "provide" $provide -}}
{{- end -}}
{{- $basePlugin := dict "type" (default "macvlan" $network.type) "master" $network.parentInterface "mode" (default "bridge" $network.mode) "ipam" $ipam -}}
{{- $plugins := list $basePlugin -}}
{{- if $network.mac -}}
{{- $plugins = append $plugins (dict "type" "tuning" "capabilities" (dict "mac" true)) -}}
{{- end -}}
{{- if $network.chainedPlugins -}}
{{- $plugins = concat $plugins $network.chainedPlugins -}}
{{- end -}}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $network.name }}
  namespace: {{ $root.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ default "0" $network.syncWave | quote }}
spec:
  config: |
    {
      "cniVersion": {{ default "0.3.1" $network.cniVersion | quote }},
      "name": {{ $network.name | quote }},
{{- if or $network.mac $network.chainedPlugins }}
      "plugins": {{ $plugins | toJson }}
{{- else }}
      "type": {{ default "macvlan" $network.type | quote }},
      "master": {{ $network.parentInterface | quote }},
      "mode": {{ default "bridge" $network.mode | quote }},
      "ipam": {{ $ipam | toJson }}
{{ end }}
    }
{{- if lt (add1 $index) (len $root.Values.multusNetworks) }}
---
{{ end }}
{{- end }}
{{- end -}}
