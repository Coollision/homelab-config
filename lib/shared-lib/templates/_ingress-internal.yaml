{{- define "shared-lib.ingress_internal" -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "helm.fullname" . }}-ingress-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    {{ if .Values.syncWave }}
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave | default 0 | quote }}
    {{- end }}
    {{- /* plain-HTTP route is only advertised to Homepage when the app has no secure internal route */}}
    {{- if not .Values.ingress_internal_secure }}
    {{- with (include "shared-lib.homepageAnnotations" (dict "root" . "scheme" "http" "host" .Values.ingress_internal.host)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  entryPoints: 
    - web
  routes:
  - kind: Rule
    match: Host(`{{ .Values.ingress_internal.host }}`)
           {{- if .Values.ingress_internal.additionalRules }}
           && {{ .Values.ingress_internal.additionalRules }}
           {{- end }}
    {{- if (default dict .Values.scaleToZero).enabled }}
    middlewares:
    - name: {{ include "helm.fullname" . }}-sablier
    {{- end }}
    services:
    - kind: Service
      name: {{ include "helm.fullname" . }}-service
      namespace: {{ .Release.Namespace }}
      port: {{ include "shared-lib.portNumber" (index (include "shared-lib.getPorts" . | fromYaml) .Values.ingress_internal.port) }}
{{- end }}
