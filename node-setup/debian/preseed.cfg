# Debian preseed for homelab nodes.
#
# Result: minimal install, user "homelab" with a LOCKED password (SSH key login
# only), passwordless sudo via /etc/sudoers.d/homelab, python3 for Ansible,
# root login and SSH password auth disabled.
#
# BEFORE USE: replace SSH_PUBLIC_KEY_PLACEHOLDER in the late_command below with
# your public key (one line, e.g. "ssh-ed25519 AAAA... user@host"). Do this in a
# local copy; never commit a real key or password to this public repo.

# Don't install standard system utilities or desktop environment
tasksel tasksel/first multiselect

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us

d-i time/zone string Europe/Brussels

# Networking: allow hostname to be auto-assigned
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string
d-i netcfg/get_domain string

# Mirrors
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Partitioning: EFI partition + 64GB root, no swap, rest unallocated (Longhorn)
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
    homelab-node-disk-layout :: \
    512 512 512 fat32 \
    $primary{ }         \
    $lvmignore{ }       \
    method{ efi }       \
    format{ }           \
    . \
    64000 64000 64000 ext4 \
        method{ format } format{ } \
        use_filesystem{ } filesystem{ ext4 } \
        mountpoint{ / } \
    . \
    10240 100% 100% \
        method{ keep } \
    .

d-i partman-auto/choose_recipe select homelab-node-disk-layout
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Disable swap partition creation/warning
d-i partman-basicfilesystems/no_swap boolean true

# Users: no root account, one "homelab" user with a locked password ("!").
# Login is SSH-key only; sudo is passwordless via sudoers.d (late_command).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string homelab
d-i passwd/username string homelab
d-i passwd/user-password-crypted password !

# Packages Ansible needs on first contact
d-i pkgsel/include string openssh-server sudo python3 curl

# One late_command (only the last preseed/late_command line would win):
# python3/sudo safety net, sudoers.d entry (validated), SSH key, sshd hardening drop-in.
d-i preseed/late_command string \
  in-target sh -c 'command -v python3 >/dev/null && command -v sudo >/dev/null || apt-get install -y python3 sudo' ; \
  in-target sh -c 'echo "homelab ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/homelab && chmod 0440 /etc/sudoers.d/homelab && visudo -cf /etc/sudoers.d/homelab' ; \
  in-target install -d -m 0700 -o homelab -g homelab /home/homelab/.ssh ; \
  in-target sh -c 'echo "SSH_PUBLIC_KEY_PLACEHOLDER" > /home/homelab/.ssh/authorized_keys' ; \
  in-target chown homelab:homelab /home/homelab/.ssh/authorized_keys ; \
  in-target chmod 0600 /home/homelab/.ssh/authorized_keys ; \
  in-target sh -c 'echo "PasswordAuthentication no" > /etc/ssh/sshd_config.d/10-homelab.conf && echo "KbdInteractiveAuthentication no" >> /etc/ssh/sshd_config.d/10-homelab.conf && echo "PermitRootLogin no" >> /etc/ssh/sshd_config.d/10-homelab.conf'

# Reboot after install
d-i finish-install/reboot_in_progress note
