name: storage-operator

on:
  push:
    branches:
      - orphan/storage-operator-standalone
    paths:
      - "storage-operator/**"
      - ".github/workflows/storage-operator.yaml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/coollision/storage-operator
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          log_range=""
          if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            log_range="${BEFORE_SHA}..${CURRENT_SHA}"
          fi

          if [[ -n "$log_range" ]]; then
            mapfile -t subjects < <(git log --format='%s' "$log_range" -- storage-operator .github/workflows/storage-operator.yaml)
          else
            mapfile -t subjects < <(git log --format='%s' -n 20 -- storage-operator .github/workflows/storage-operator.yaml)
          fi

          if [[ ${#subjects[@]} -eq 0 ]]; then
            echo "No relevant commits detected; skipping commit lint."
            exit 0
          fi

          regex='^(feat|fix|chore|refactor|docs|ci|test|perf|build|style|revert)(\([^)]+\))?(!)?: .+'
          invalid=0

          for subject in "${subjects[@]}"; do
            [[ -z "$subject" ]] && continue
            [[ "$subject" =~ ^Merge\  ]] && continue
            if [[ ! "$subject" =~ $regex ]]; then
              echo "Invalid Conventional Commit subject: $subject"
              invalid=1
            fi
          done

          if [[ $invalid -ne 0 ]]; then
            echo "Commit lint failed. Use Conventional Commits (e.g. feat:, fix:, chore:)."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-commits
    defaults:
      run:
        working-directory: storage-operator
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: storage-operator/go.mod
          cache-dependency-path: storage-operator/go.sum

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Vet
        run: go vet ./...

      # Includes the golden-file parity tests and shellcheck on every rendered script.
      - name: Run tests
        run: go test -race ./...

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and render chart
        run: |
          helm lint chart
          helm template storage-operator chart > /dev/null
          helm template storage-operator chart --set pvReclaimer.enabled=true > /dev/null

      - name: Assert chart invariants
        run: |
          set -euo pipefail
          out=$(helm template smb-operator chart)
          # Single replica + leader election + readyz-after-reconcile deadlocks a RollingUpdate.
          grep -A1 '^  strategy:' <<<"$out" | grep -q 'type: Recreate' || { echo "Deployment strategy must be Recreate"; exit 1; }

  versioning:
    name: Versioning
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [lint-commits, test]
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve semantic version and update chart files
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          chart_file="storage-operator/chart/Chart.yaml"
          values_file="storage-operator/chart/values.yaml"

          current_version=$(grep '^version:' "$chart_file" | awk '{print $2}')
          current_major=${current_version%%.*}
          current_minor_patch=${current_version#*.}
          current_minor=${current_minor_patch%%.*}
          current_patch=${current_version##*.}

          log_range=""
          if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            log_range="${BEFORE_SHA}..${CURRENT_SHA}"
          fi

          commit_messages=""
          if [[ -n "$log_range" ]]; then
            commit_messages=$(git log --format='%s%n%b' "$log_range" -- storage-operator .github/workflows/storage-operator.yaml || true)
          else
            commit_messages=$(git log --format='%s%n%b' -n 20 -- storage-operator .github/workflows/storage-operator.yaml || true)
          fi

          bump_type="patch"
          if echo "$commit_messages" | grep -Eiq 'BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:'; then
            bump_type="major"
          elif echo "$commit_messages" | grep -Eiq '^feat(\([^)]+\))?:'; then
            bump_type="minor"
          fi

          next_major=$current_major
          next_minor=$current_minor
          next_patch=$current_patch

          case "$bump_type" in
            major)
              next_major=$((current_major + 1))
              next_minor=0
              next_patch=0
              ;;
            minor)
              next_minor=$((current_minor + 1))
              next_patch=0
              ;;
            patch)
              next_patch=$((current_patch + 1))
              ;;
          esac

          next_version="${next_major}.${next_minor}.${next_patch}"

          image_tag="v${next_version}"

          sed -i -E "s/^version: .*/version: ${next_version}/" "$chart_file"
          sed -i -E "s/^appVersion: .*/appVersion: ${next_version}/" "$chart_file"
          sed -i -E "s/^  tag: .*/  tag: ${image_tag}/" "$values_file"

          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${next_version} via ${bump_type} bump"

      - name: Commit version updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- storage-operator/chart/Chart.yaml storage-operator/chart/values.yaml; then
            echo "No version file updates to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage-operator/chart/Chart.yaml storage-operator/chart/values.yaml
          git commit -m "chore(release): bump storage-operator to ${{ steps.version.outputs.image_tag }} [skip ci]"
          git push

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test, versioning]
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: storage-operator
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: storage-operator/go.mod
          cache-dependency-path: storage-operator/go.sum

      - name: Build linux/${{ matrix.arch }} binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w" -o dist/manager-linux-${{ matrix.arch }} ./

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-linux-${{ matrix.arch }}
          path: storage-operator/dist/manager-linux-${{ matrix.arch }}
          if-no-files-found: error
          # Intermediate hand-off to the build job in this same run; do not keep for 90d.
          retention-days: 1

  build:
    name: Build & Push
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [test, versioning, build-binaries]
    outputs:
      image-tag: ${{ needs.versioning.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: manager-linux-amd64
          path: storage-operator/dist

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: manager-linux-arm64
          path: storage-operator/dist

      - name: Ensure binaries are executable
        run: chmod +x storage-operator/dist/manager-linux-amd64 storage-operator/dist/manager-linux-arm64

      - name: Resolve build revision
        id: gitmeta
        shell: bash
        run: |
          echo "sha_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: storage-operator
          file: storage-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.versioning.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.gitmeta.outputs.sha_short }}
          labels: |
            org.opencontainers.image.version=${{ needs.versioning.outputs.version }}
            org.opencontainers.image.revision=${{ steps.gitmeta.outputs.sha_full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    name: Publish Helm Chart (OCI)
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [versioning, build]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR for Helm OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          helm package storage-operator/chart --destination .
          CHART_TGZ=$(find . -maxdepth 1 -name "storage-operator-*.tgz" | head -n 1)
          helm push "$CHART_TGZ" oci://ghcr.io/coollision/charts

  tag-release:
    name: Create Release Tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [versioning, build, publish-chart]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Create and push semver tag
        shell: bash
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
        run: |
          set -euo pipefail
          tag="storage-operator/v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
