# Scratch rehearsal of workload/smarthome/mosquitto (dynsec + ACL + TLS route + Local policy).
# Fake credentials, own namespace + Longhorn volume. Delete when the rehearsal is done.
fullnameOverride: mosquitto-test

statefulset:
  image:
    repository: eclipse-mosquitto
    tag: "2.1.2-alpine"
  ports:
    mqtt: 1883

config:
  TZ: Europe/Brussels

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

storage:
  - mountPath: /mosquitto/data
    size: 128Mi
    type: longhorn
    volumeName: mosquitto-test
    replicas: 2
    protect: false
