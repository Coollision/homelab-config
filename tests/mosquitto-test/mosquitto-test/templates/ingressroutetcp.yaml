apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-test-tls
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`mqtt-test.<secret:kv/data/shared/domains~domain>`)
      services:
        - name: mosquitto-test-mqtt
          port: 1880
  tls:
    passthrough: false
