fullnameOverride: sync-in-db

# Pilot (tests branch): MariaDB only holds Sync-in metadata (users, shares, search index), never file content.
# Sync-in is MySQL/MariaDB-only (Drizzle mysql-core, JSON_ARRAYAGG, ON DUPLICATE KEY), so CNPG cannot be used.
statefulset:
  image:
    repository: mariadb
    tag: "11.8"
  # Flags copied from the upstream compose file; the collation and max-allowed-packet are required by Sync-in.
  args:
    - --innodb_ft_cache_size=16000000
    - --max-allowed-packet=1G
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_uca1400_ai_ci
  ports:
    db: 3306

config:
  MYSQL_ROOT_PASSWORD: <secret:kv/data/tests/sync-in~db-root-password>
  MYSQL_DATABASE: sync_in

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

# Disposable pilot volume: single replica, no backup/protect.
storage:
  - mountPath: /var/lib/mysql
    size: 2Gi
    type: longhorn
    replicas: 1
    backup: false
    protect: false
    # non-empty labels: the lib renders a bare `{}` (invalid YAML) when backup+protect are both off
    labels:
      pilot: "true"
