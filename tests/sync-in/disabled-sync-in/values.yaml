fullnameOverride: sync-in

# Pilot (tests branch). Internal ingress only. The point of the test: file content lives as a plain tree on the NAS
# over NFS 4.1 (no xattrs there), Sync-in keeps only metadata in MariaDB.
statefulset:
  image:
    repository: syncin/server
    tag: 2.6.1
  ports:
    http: 8080

# Folder on the NAS share. The NAS squashes ids (everything appears as 1024:100), so the container runs as that
# user; otherwise the entrypoint's chown -R on /app/data is refused and the pod crash-loops.
# The init container also removes the leftover empty test folders from the earlier OpenCloud tests.
initContainers:
  - name: nfs-dir
    image: busybox:1.37.0
    command:
      - /bin/sh
      - -c
      - |
        cd /nfs/opencloud-pilot 2>/dev/null && for d in v41 v42 v41-lowcache v41-noac smb retest; do rm -rf "$d"; done
        mkdir -p /nfs/opencloud-pilot/sync-in && chmod 0777 /nfs/opencloud-pilot /nfs/opencloud-pilot/sync-in
        ls -lnd /nfs/opencloud-pilot/*
    securityContext:
      runAsUser: 0
    volumeMounts:
      - name: sync-in-nfs
        mountPath: /nfs

config:
  PUID: "1024"
  PGID: "100"
  INIT_ADMIN: "true"
  INIT_ADMIN_LOGIN: admin
  INIT_ADMIN_PASSWORD: <secret:kv/data/tests/sync-in~admin-password>
  SYNCIN_SERVER_PUBLICURL: https://sync-in.<secret:kv/data/shared/domains~domain>
  SYNCIN_MYSQL_URL: mysql://root:<secret:kv/data/tests/sync-in~db-root-password>@sync-in-db-service:3306/sync_in
  SYNCIN_AUTH_ENCRYPTIONKEY: <secret:kv/data/tests/sync-in~enc-key>
  SYNCIN_AUTH_TOKEN_ACCESS_SECRET: <secret:kv/data/tests/sync-in~token-access>
  SYNCIN_AUTH_TOKEN_REFRESH_SECRET: <secret:kv/data/tests/sync-in~token-refresh>
  # V8 sizes its heap off host RAM, not the cgroup limit, so cap it below the container limit.
  NODE_OPTIONS: --max-old-space-size=512

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

ingress_internal_secure:
  host: sync-in.<secret:kv/data/shared/domains~domain>
  port: http

storage:
  - mountPath: /app/data
    type: existingClaim
    claimName: sync-in-pilot-nfs
    nameSuffix: nfs
    subPath: opencloud-pilot/sync-in
