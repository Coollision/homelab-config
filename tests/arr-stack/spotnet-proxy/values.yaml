fullnameOverride: spotnet-proxy

# Stateless Newznab proxy between Prowlarr and Spotweb: rewrites Spotnet release titles into names Sonarr can match
# (show name -> Sonarr's title, "Seizoen N" -> "SNN", "NL Gesproken" -> "DUTCH"), turns Spotweb-unfriendly tvsearch
# requests into plain searches. Everything else passes through. The show aliases are built automatically from
# Sonarr's series list (title + alternate titles, refreshed every 10 minutes); aliases.json only holds manual overrides.
# See wiki/03-media-stack/overview.md#spotnet-proxy. The script runs on the stock python image, nothing to build.
deployment:
  image:
    repository: python
    tag: 3.13.18-alpine
  command: ["python3", "-u", "/app/proxy.py"]
  ports:
    http: 8080

secrets:
  - name: spotnet-proxy-sonarr
    secret_kv:
      api_key: <secret:kv/data/workload/arr-stack/sonarr~api-key>

config:
  TZ: Europe/Brussels
  UPSTREAM: http://spotweb-service.arr-stack.svc.cluster.local:80
  SONARR_URL: http://sonarr-service.arr-stack.svc.cluster.local:8989
  SONARR_API_KEY: {secretKeyRef: {name: spotnet-proxy-sonarr, key: api_key}}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

probes:
  readiness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 30

configMaps:
  - name: spotnet-proxy
    data:
      proxy.py: |
        """Newznab title normaliser in front of Spotweb (Spotnet).

        Spotnet release names do not follow scene naming ("Woezel En Pip Vriendjesclub (2021) Seizoen 1 ... NL Gesproken"),
        so Sonarr/Radarr cannot match them to a series or detect the language. This stateless proxy forwards every request to
        Spotweb unchanged and only rewrites the <title> of search results: alias -> canonical series title, "Seizoen N" ->
        "SNN", "E01t/mE07" -> "E01-E07", "NL Gesproken" -> "DUTCH". Downloads (t=get) and everything else pass through.
        """
        import html
        import json
        import logging
        import os
        import re
        import threading
        import time
        import urllib.error
        import urllib.parse
        import urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        UPSTREAM = os.environ.get("UPSTREAM", "http://spotweb-service.arr-stack.svc.cluster.local:80").rstrip("/")
        ALIASES_FILE = os.environ.get("ALIASES_FILE", "/app/aliases.json")
        LISTEN = int(os.environ.get("LISTEN_PORT", "8080"))
        LOG = logging.getLogger("spotnet-proxy")

        SEP = r"[\W_]+"


        def _alias_regex(alias):
            tokens = [re.escape(t) for t in re.split(SEP, alias.strip()) if t]
            return re.compile(r"^(\W*)" + SEP.join(tokens) + r"(?=$|[\W_])", re.IGNORECASE)


        def load_aliases(path=ALIASES_FILE):
            with open(path, encoding="utf-8") as fh:
                raw = json.load(fh)
            rules = []
            for canonical, spec in raw.items():
                aliases = spec.get("aliases", []) if isinstance(spec, dict) else spec
                search = spec.get("search", canonical) if isinstance(spec, dict) else canonical
                for alias in {canonical, *aliases}:
                    rules.append((_alias_regex(alias), canonical, len(alias), search))
            rules.sort(key=lambda r: -r[2])  # longest alias first
            return rules


        CONNECTORS = {"and", "en", "&", "+"}
        STOP_FOR_SEARCH = {"and", "en", "&"}
        SONARR_URL = os.environ.get("SONARR_URL", "").rstrip("/")
        SONARR_API_KEY = os.environ.get("SONARR_API_KEY", "")
        REFRESH_SECONDS = int(os.environ.get("REFRESH_SECONDS", "600"))
        MANUAL_RULES = []
        AUTO_RULES = []
        _LOCK = threading.Lock()


        def _tokens(title):
            t = re.sub(r"\(\s*(?:19|20)\d\d\s*\)\s*$", "", title.strip())  # trailing "(2021)"
            t = t.lower().replace("&", " and ").replace("+", " and ")
            t = re.sub(r"['\u2019`]", "", t)
            return [x for x in re.split(SEP, t) if x]


        def auto_rule(title):
            """Flexible start-anchored regex for a series title: connector words (and/en/&/+) are interchangeable and
            optional, punctuation and a trailing year are ignored. Returns (regex, canonical, weight, search term)."""
            toks = _tokens(title)
            if len(toks) < 1 or sum(len(x) for x in toks) < 4:
                return None
            parts = []
            for i, tok in enumerate(toks):
                if tok in CONNECTORS and 0 < i < len(toks) - 1:
                    parts.append(r"(?:(?:and|en|&|\+)" + SEP + r")?")
                else:
                    parts.append(re.escape(tok) + (SEP if i < len(toks) - 1 else ""))
            rx = re.compile(r"^(\W*)" + "".join(parts).rstrip() + r"(?=$|[\W_])", re.IGNORECASE)
            search = " ".join(x for x in toks if x not in STOP_FOR_SEARCH)
            return (rx, title, len(title), search)


        def fetch_sonarr_rules():
            req = urllib.request.Request(SONARR_URL + "/api/v3/series", headers={"X-Api-Key": SONARR_API_KEY})
            with urllib.request.urlopen(req, timeout=30) as resp:
                series = json.load(resp)
            rules, seen = [], set()
            for s in series:
                canonical = re.sub(r"\s*\((?:19|20)\d\d\)\s*$", "", s["title"])
                canonical = re.sub(r"\s*:\s*", " ", canonical)  # Sonarr/indexers drop colons in release names
                for name in [s["title"]] + [a["title"] for a in s.get("alternateTitles", [])]:
                    key = (name.lower(), canonical)
                    rule = auto_rule(name)
                    if rule and key not in seen:
                        seen.add(key)
                        rules.append((rule[0], canonical, rule[2], rule[3]))
            return rules


        def refresh_loop():
            global AUTO_RULES
            while True:
                try:
                    rules = fetch_sonarr_rules()
                    rules.sort(key=lambda r: -r[2])
                    with _LOCK:
                        AUTO_RULES = rules
                    LOG.info("auto aliases: %d rules from %s", len(rules), SONARR_URL)
                except Exception as err:
                    LOG.warning("could not refresh aliases from Sonarr (%s); keeping %d rules", err, len(AUTO_RULES))
                time.sleep(REFRESH_SECONDS)


        def current_rules():
            with _LOCK:
                auto = AUTO_RULES
            return MANUAL_RULES + auto  # manual overrides are checked first; auto rules are pre-sorted longest first


        DUTCH = re.compile(r"\b(?:nl|nederlands)[\W_]*gespr\w*|\bnederlands\b", re.IGNORECASE)
        HAS_LANG = re.compile(r"\b(?:dutch|flemish|vlaams)\b", re.IGNORECASE)
        SEIZOEN = re.compile(r"\bseizoen[\W_]*(\d{1,2})\b", re.IGNORECASE)
        EP_RANGE = re.compile(r"\bE(\d{1,3})[\W_]*t[\W_]*/?[\W_]*m[\W_]*E?(\d{1,3})\b", re.IGNORECASE)
        S_THEN_E = re.compile(r"\b(S\d{1,2})[\W_]+(E\d{1,3})", re.IGNORECASE)


        def normalise(title, rules):
            out = title
            for regex, canonical, _, _search in rules:
                new, n = regex.subn(lambda m: m.group(1) + canonical, out, count=1)
                if n:
                    out = new
                    break
            out = SEIZOEN.sub(lambda m: "S%02d" % int(m.group(1)), out)
            # multi-season packs ("S01 S02 S03 E01tmE07") are ambiguous: leave their episode markers alone
            if len(re.findall(r"\bS\d{1,2}\b", out, re.IGNORECASE)) <= 1:
                out = EP_RANGE.sub(lambda m: "E%02d-E%02d" % (int(m.group(1)), int(m.group(2))), out)
                out = S_THEN_E.sub(lambda m: m.group(1).upper() + m.group(2).upper(), out)
            if DUTCH.search(out) and not HAS_LANG.search(out):
                out += " DUTCH"
            return out


        TV_ONLY_PARAMS = ("season", "ep", "tvdbid", "tvmazeid", "rid", "imdbid", "tmdbid", "traktid", "doubanid")


        def rewrite_query(path, rules):
            """Spotweb's t=tvsearch finds nothing for Spotnet releases, but t=search does. Convert the request, drop the
            season/episode/id filters (Sonarr's decision engine filters on the parsed title anyway) and replace the show
            name in q with a term Spotnet titles contain ("and" vs "en", "&", ...)."""
            parts = urllib.parse.urlsplit(path)
            params = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
            if dict(params).get("t") != "tvsearch":
                return path
            out = []
            for k, v in params:
                if k == "t":
                    v = "search"
                elif k in TV_ONLY_PARAMS:
                    continue
                elif k == "q":
                    for regex, _canonical, _, search in rules:
                        m = regex.match(v)
                        if m:
                            v = search + v[m.end():]
                            break
                out.append((k, v))
            return urllib.parse.urlunsplit(("", "", parts.path, urllib.parse.urlencode(out), ""))


        ITEM = re.compile(r"<item\b.*?</item>", re.DOTALL)
        TITLE = re.compile(r"(<title>)(.*?)(</title>)", re.DOTALL)


        def rewrite_xml(body, rules):
            changed = 0

            def fix_item(m):
                nonlocal changed

                def fix_title(t):
                    nonlocal changed
                    raw = t.group(2)
                    cdata = raw.strip().startswith("<![CDATA[")
                    text = raw.strip()[9:-3] if cdata else html.unescape(raw)
                    new = normalise(text, rules)
                    if new == text:
                        return t.group(0)
                    changed += 1
                    LOG.info("title: %r -> %r", text, new)
                    return t.group(1) + ("<![CDATA[%s]]>" % new if cdata else html.escape(new, quote=False)) + t.group(3)

                return TITLE.sub(fix_title, m.group(0), count=1)

            return ITEM.sub(fix_item, body), changed


        class Handler(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def log_message(self, fmt, *args):  # quiet access log
                LOG.debug(fmt, *args)

            def do_GET(self):
                if self.path == "/healthz":
                    return self._send(200, [("Content-Type", "text/plain")], b"ok")
                path = rewrite_query(self.path, current_rules())
                LOG.info("GET %s%s", re.sub(r"apikey=[^&]*", "apikey=***", path)[:300], " (rewritten)" if path != self.path else "")
                req = urllib.request.Request(UPSTREAM + path)
                for h in ("Host", "User-Agent", "Accept"):
                    if self.headers.get(h):
                        req.add_header(h, self.headers[h])
                req.add_header("Accept-Encoding", "identity")
                try:
                    with urllib.request.urlopen(req, timeout=120) as resp:
                        status, headers, body = resp.status, resp.getheaders(), resp.read()
                except urllib.error.HTTPError as err:
                    status, headers, body = err.code, err.headers.items(), err.read()
                except Exception as err:  # upstream down: fail visibly, never pass partial data
                    LOG.error("upstream error: %s", err)
                    return self._send(502, [("Content-Type", "text/plain")], b"upstream error")
                ctype = next((v for k, v in headers if k.lower() == "content-type"), "")
                if status == 200 and ("xml" in ctype or body[:5] == b"<?xml") and b"<item" in body:
                    try:
                        text, n = rewrite_xml(body.decode("utf-8", "replace"), current_rules())
                        body = text.encode("utf-8")
                    except Exception as err:  # on any rewrite bug serve the original
                        LOG.error("rewrite failed: %s", err)
                skip = {"transfer-encoding", "content-length", "connection", "content-encoding"}
                self._send(status, [(k, v) for k, v in headers if k.lower() not in skip], body)

            def _send(self, status, headers, body):
                self.send_response(status)
                for k, v in headers:
                    self.send_header(k, v)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)


        if __name__ == "__main__":
            logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
            MANUAL_RULES = load_aliases()
            LOG.info("%d manual alias rules, upstream %s", len(MANUAL_RULES), UPSTREAM)
            if SONARR_URL and SONARR_API_KEY:
                threading.Thread(target=refresh_loop, daemon=True).start()
            else:
                LOG.warning("SONARR_URL/SONARR_API_KEY not set: only manual aliases")
            ThreadingHTTPServer(("0.0.0.0", LISTEN), Handler).serve_forever()
      aliases.json: |
        {}

storage:
  - mountPath: /app
    type: configMap
    configMapName: spotnet-proxy
    nameSuffix: app
