  # Why nginx in front: Squid built with GnuTLS (ubuntu/squid) accepts clients with no cert or a cert
  # from the wrong CA, so mTLS must be enforced at the handshake by something else. nginx also does
  # ssl_crl for revocation (Traefik cannot).
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events {}
    stream {
      log_format rp '$remote_addr $ssl_client_s_dn $ssl_client_verify $status $bytes_sent/$bytes_received';
      access_log /dev/stdout rp;
      server {
        listen 8443 ssl;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_client_certificate /ca/clientca.crt;
        ssl_verify_client on;
        proxy_pass 127.0.0.1:3128;
      }
    }
  squid.conf: |
    http_port 127.0.0.1:3128
    acl CONNECT method CONNECT
    acl SSL_ports port 443
    # Spike allowlist: the internal zone plus one public site to prove the tunnel end to end.
    acl allowed_dst dstdomain .<secret:kv/data/shared/domains~local> example.com
    acl bad_dst dst 127.0.0.0/8 169.254.0.0/16 10.42.0.0/16 10.43.0.0/16
    http_access deny !SSL_ports
    http_access deny bad_dst
    http_access allow CONNECT allowed_dst
    http_access deny all
    cache deny all
    access_log stdio:/tmp/access.log
    pid_filename /tmp/squid.pid
