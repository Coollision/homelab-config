  clientca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIBbTCCARSgAwIBAgIUFHRASU6oSXyTHqqEX5Dc88lhnRQwCgYIKoZIzj0EAwIw
    HTEbMBkGA1UEAwwScnAtc3Bpa2UtY2xpZW50LWNhMB4XDTI2MTEyMzE5MDAzOFoX
