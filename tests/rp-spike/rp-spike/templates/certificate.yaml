# Server cert for the proxy name (DNS-01, so no inbound port needed for issuance).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rp-spike
spec:
  secretName: rp-spike-tls
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-issuer
  dnsNames:
    - rp.<secret:kv/data/shared/domains~domain>
