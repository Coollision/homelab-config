apiVersion: apps/v1
kind: Deployment
metadata:
  name: rp-spike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rp-spike
  template:
    metadata:
      labels:
        app: rp-spike
      annotations:
        # No reloader in this scratch app: bump when the ConfigMap changes.
        spike-config-rev: "1"
    spec:
      containers:
        - name: nginx-mtls
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 8443
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: conf, mountPath: /ca/clientca.crt, subPath: clientca.crt }
            - { name: tls, mountPath: /tls }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
        - name: squid
          image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
          command: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
          volumeMounts:
            - { name: conf, mountPath: /etc/squid/squid.conf, subPath: squid.conf }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
      volumes:
        - name: conf
          configMap:
            name: rp-spike
        - name: tls
          secret:
            secretName: rp-spike-tls
