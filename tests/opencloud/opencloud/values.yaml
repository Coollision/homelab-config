fullnameOverride: opencloud

# Pilot (tests branch). Internal ingress only (no ingress_external_secure). The <domain> host gets the
# wildcard cert; a <local> host would serve Traefik's self-signed default, which the clients reject.
statefulset:
  image:
    repository: opencloudeu/opencloud-rolling
    tag: 8.1.0
  # `opencloud init` writes secrets + opencloud.yaml once and fails on later runs, hence `|| true`.
  # `--insecure false` is required: without it init prompts on stdin and loops forever in a pod.
  command: ["/bin/sh"]
  args: ["-c", "opencloud init --insecure false || true; exec opencloud server"]
  ports:
    http: 9200

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

config:
  OC_URL: https://opencloud.<secret:kv/data/shared/domains~domain>
  # TLS terminates at Traefik.
  PROXY_TLS: "false"
  OC_LOG_LEVEL: info
  # Pilot only: lets curl/rclone test WebDAV without a browser OIDC flow. Real clients use OIDC; drop this for production.
  PROXY_ENABLE_BASIC_AUTH: "true"
  # Plain tree on disk: user data is browsable files, changes made on disk are picked up via inotify.
  STORAGE_USERS_DRIVER: posix
  STORAGE_USERS_POSIX_ROOT: /var/lib/opencloud/storage/users
  STORAGE_USERS_POSIX_WATCH_FS: "true"
  # PosixFS needs a shared ID cache store for the watcher.
  STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
  # `.CURRENT` / `.REV.*` files; server-side versioning (no retention cleanup upstream yet).
  STORAGE_USERS_POSIX_ENABLE_FS_REVISIONS: "true"

# Memory limit sized for the all-in-one process (search index + embedded NATS).
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi

ingress_internal_secure:
  host: opencloud.<secret:kv/data/shared/domains~domain>
  port: http

# Test matrix for PosixFS-on-NFS (opencloud#1596). `nosharecache` is needed so the option sets are not
# silently merged with the arr stack's existing mount of the same export on the same node.
nfsVariants:
  v41: [vers=4.1, hard, nosharecache]
  v42: [vers=4.2, hard, nosharecache]
  v41-lowcache: [vers=4.1, hard, nosharecache, acregmin=1, acregmax=5, acdirmin=1, acdirmax=5]
  v41-noac: [vers=4.1, hard, nosharecache, noac]

# Creates the per-variant folders on the NAS. chown is refused by the NAS (squashed ids), so open the mode instead.
initContainers:
  - name: nfs-dir
    image: busybox:1.37.0
    command: ["/bin/sh", "-c", "mkdir -p /nfs/opencloud-pilot && for v in v41 v42 v41-lowcache v41-noac; do mkdir -p /nfs/opencloud-pilot/$v; done && chmod -R 0777 /nfs/opencloud-pilot; mkdir -p /state/storage/users && chown -R 1000:1000 /state/storage; id; ls -lnd /nfs/opencloud-pilot/*"]
    securityContext:
      runAsUser: 0
    volumeMounts:
      - name: opencloud-nfs
        mountPath: /nfs
      # kubelet creates the nested NFS mount point inside the emptyDir as root; hand it to uid 1000 first.
      - name: opencloud-state
        mountPath: /state

# App state (NATS, search index, IDM, IDP keys) is throwaway: emptyDir, so every pod restart starts clean and
# the only thing under test is the user-data root on NFS. Config (/etc/opencloud) keeps the generated secrets.
storage:
  - mountPath: /var/lib/opencloud
    type: emptyDir
    nameSuffix: state
  # Active variant: keep claimName and subPath in sync with the variant name.
  - mountPath: /var/lib/opencloud/storage/users
    type: existingClaim
    claimName: opencloud-pilot-nfs-v42
    nameSuffix: nfs
    subPath: opencloud-pilot/v42
  - mountPath: /etc/opencloud
    size: 1Gi
    type: longhorn
    replicas: 1
    backup: false
    protect: false
    # non-empty labels: the lib renders a bare `{}` (invalid YAML) when backup+protect are both off
    labels:
      pilot: "true"
    nameSuffix: config
  # Previous pilot state on local Longhorn, kept (not pruned) until deletion is approved.
  - mountPath: /mnt/old-pilot-data
    size: 10Gi
    type: longhorn
    replicas: 1
    backup: false
    protect: false
    labels:
      pilot: "true"
    nameSuffix: data
