fullnameOverride: opencloud

# Pilot (tests branch). Internal ingress only (no ingress_external_secure). The <domain> host gets the
# wildcard cert; a <local> host would serve Traefik's self-signed default, which the clients reject.
statefulset:
  image:
    repository: opencloudeu/opencloud-rolling
    tag: 8.1.0
  # `opencloud init` writes secrets + opencloud.yaml once and fails on later runs, hence `|| true`.
  # `--insecure false` is required: without it init prompts on stdin and loops forever in a pod.
  command: ["/bin/sh"]
  args: ["-c", "opencloud init --insecure false || true; exec opencloud server"]
  ports:
    http: 9200

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

config:
  OC_URL: https://opencloud.<secret:kv/data/shared/domains~domain>
  # TLS terminates at Traefik.
  PROXY_TLS: "false"
  OC_LOG_LEVEL: info
  # Pilot only: lets curl/rclone test WebDAV without a browser OIDC flow. Real clients use OIDC; drop this for production.
  PROXY_ENABLE_BASIC_AUTH: "true"
  # Decomposed driver: blobs + metadata on a plain POSIX volume. OpenCloud hardcodes the `messagepack` metadata
  # backend for it (sidecar files, no user xattrs), so it can run on the Synology NFS 4.1 share where PosixFS cannot.
  # Trade-off: the tree is node-id based (not browsable), no fs watcher, nothing may edit it behind OpenCloud's back.
  STORAGE_USERS_DRIVER: decomposed
  STORAGE_USERS_DECOMPOSED_ROOT: /var/lib/opencloud/storage/users

# Only the user data (storage/users) lives on the NAS; embedded NATS/IDM/search index stay on Longhorn
# (bolt/leveldb files do not belong on NFS). The NAS squashes ids, so the folder is created 0777 by root.
initContainers:
  - name: nfs-dir
    image: busybox:1.37.0
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /nfs/opencloud-pilot/decomposed
        chmod 0777 /nfs/opencloud-pilot /nfs/opencloud-pilot/decomposed
        ls -lnd /nfs/opencloud-pilot/*
    securityContext:
      runAsUser: 0
    volumeMounts:
      - name: opencloud-nfs
        mountPath: /nfs

# Memory limit sized for the all-in-one process (search index + embedded NATS).
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi

ingress_internal_secure:
  host: opencloud.<secret:kv/data/shared/domains~domain>
  port: http

# HISTORY: PosixFS cannot run on the Synology (NFSv4.1 only, no user xattrs; SMB also refuses user.*). Retest matrix for
# posix-on-NFS lives in git history (nfsVariants). This pilot tests the decomposed driver on the same share instead.
nfsVariants:
  v41: [vers=4.1, hard, nosharecache]

# /var/lib/opencloud (NATS, IDM, search index) on a node disk; user data is mounted on top from the NAS below.
# replicas: 1 keeps it effectively local; backup/protect off so the pilot is disposable.
storage:
  - mountPath: /var/lib/opencloud
    size: 10Gi
    type: longhorn
    replicas: 1
    backup: false
    protect: false
    # non-empty labels: the lib renders a bare `{}` (invalid YAML) when backup+protect are both off
    labels:
      pilot: "true"
    nameSuffix: data
  - mountPath: /etc/opencloud
    size: 1Gi
    type: longhorn
    replicas: 1
    backup: false
    protect: false
    labels:
      pilot: "true"
    nameSuffix: config
  - mountPath: /var/lib/opencloud/storage/users
    type: existingClaim
    claimName: opencloud-pilot-nfs-v41
    nameSuffix: nfs
    subPath: opencloud-pilot/decomposed
