[global]
workgroup = WORKGROUP
server string = Homelab Storage
security = user
map to guest = Never
restrict anonymous = 1
guest ok = no
log level = 1

# idmap — required to avoid 'range not specified' warnings on connect
idmap config * : backend = tdb
idmap config * : range = 1000-9999

# Performance tuning (Samba 4.21+)
socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
read raw = yes
write raw = yes
max xmit = 65535
dead time = 15
getwd cache = yes
aio read size = 1
aio write size = 1
use sendfile = yes
server multi channel support = yes
strict locking = no
oplocks = yes
level2 oplocks = yes

[cfg]
path = /shares/cfg
available = yes
browseable = yes
public = no
guest ok = no
writable = no
read only = yes
valid users = smbuser
write list = 
force user = root
force group = root
veto files = /.DS_Store/._*/.Spotlight-V100/.TemporaryItems/.Trashes/.fseventsd/Thumbs.db/desktop.ini/$RECYCLE.BIN/System Volume Information/lost+found/
delete veto files = yes
create mask = 0755
directory mask = 0755
