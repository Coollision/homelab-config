{{- if and .Values.smb.enabled .Values.config.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.name }}
  namespace: {{ include "storage-operator.namespace" . }}
  labels:
    {{- include "storage-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config.data | nindent 4 }}
{{- end }}
