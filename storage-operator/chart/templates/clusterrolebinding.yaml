{{- if and .Values.rbac.create .Values.smb.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "storage-operator.fullname" . }}
  labels:
    {{- include "storage-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "storage-operator.serviceAccountName" . }}
    namespace: {{ include "storage-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "storage-operator.fullname" . }}
{{- end }}
