{{- if and .Values.smb.enabled .Values.migration.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.migration.name }}
  namespace: {{ include "storage-operator.namespace" . }}
  labels:
    {{- include "storage-operator.labels" . | nindent 4 }}
  {{- with .Values.migration.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  volumes.yaml: |
    {{- toYaml (dict "volumes" .Values.migration.volumes) | nindent 4 }}
{{- end }}
