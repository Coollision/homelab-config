apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storage-operator.fullname" . }}
  namespace: {{ include "storage-operator.namespace" . }}
  labels:
    {{- include "storage-operator.selectorLabels" . | nindent 4 }}
    {{- with .Values.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "storage-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "storage-operator.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config.data | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "storage-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.operatorArgs.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.operatorArgs.healthProbeBindAddress }}
            - --leader-elect={{ .Values.operatorArgs.leaderElect }}
            - --enable-smb={{ .Values.smb.enabled }}
            - --enable-pv-reclaimer={{ .Values.pvReclaimer.enabled }}
            - --owner-deployment={{ .Values.ownerDeploymentName | default (include "storage-operator.fullname" .) }}
            - --dry-run={{ .Values.dryRun }}
            {{- range .Values.operatorArgs.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MAP_NAME
              value: {{ .Values.config.name | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.smb.enabled }}
            - name: SMB_LOADBALANCER_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ip
            - name: SMB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: username
            - name: SMB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: password
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: probes
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: probes
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
