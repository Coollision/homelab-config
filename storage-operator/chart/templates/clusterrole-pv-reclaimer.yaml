{{- /* Kept apart from the SMB rules: turning the reclaimer off removes its write access to every PV. */}}
{{- if and .Values.rbac.create .Values.pvReclaimer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "storage-operator.fullname" . }}-pv-reclaimer
  labels:
    {{- include "storage-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "storage-operator.fullname" . }}-pv-reclaimer
  labels:
    {{- include "storage-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "storage-operator.serviceAccountName" . }}
    namespace: {{ include "storage-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "storage-operator.fullname" . }}-pv-reclaimer
{{- end }}
