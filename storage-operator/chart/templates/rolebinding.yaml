{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "storage-operator.fullname" . }}
  namespace: {{ include "storage-operator.namespace" . }}
  labels:
    {{- include "storage-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "storage-operator.serviceAccountName" . }}
    namespace: {{ include "storage-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "storage-operator.fullname" . }}
{{- end }}
