apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
type: Opaque
data:
  api-token: <secret:kv/data/system/cert-manager/cert-manager~cloudflare-api-token | base64>
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-issuer
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@<secret:kv/data/shared/domains~domain>
    privateKeySecretRef:
      name: letsencrypt-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - <secret:kv/data/shared/domains~domain>
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert-<secret:kv/data/shared/domains~domain-dash>
  namespace: default
spec:
  secretName: wildcard-cert-<secret:kv/data/shared/domains~domain-dash>-key
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-issuer
  dnsNames:
    - <secret:kv/data/shared/domains~domain>
    - "*.<secret:kv/data/shared/domains~domain>"
