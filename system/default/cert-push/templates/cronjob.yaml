{{- range .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helm.labels" $ | nindent 4 }}
spec:
  schedule: {{ if .force }}"0 0 1 1 *"{{ else }}{{ $.Values.schedule | quote }}{{ end }}
  timeZone: {{ $.Values.timeZone | quote }}
  suspend: {{ .suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1 # daily schedule, so about one day of successes
  # 1: the stock KubeJobFailed rule fires while a failed Job exists, so a stale failure must not linger for long.
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0 # never retry a login (DSM auto-block counts failures)
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 259200 # 3 days: failed Jobs stay long enough to inspect (successes go sooner via the history limit)
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cert-push
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false # the job never talks to the Kubernetes API
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: push
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["/bin/bash", "/script/push.sh"]
              env:
                - name: TARGETS
                  value: {{ $.Values.targets | quote }}
                - name: DRYRUN
                  value: {{ if $.Values.dryRun }}"1"{{ else }}"0"{{ end }}
                - name: FORCE
                  value: {{ if .force }}"1"{{ else }}"0"{{ end }}
                - name: NAS_API_PORT
                  value: {{ $.Values.nasApiPort | quote }}
                - name: NODE_NAME # logged with every run: failures once correlated with one VM node only
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: script, mountPath: /script, readOnly: true }
                - { name: certs, mountPath: /certs, readOnly: true }
                - { name: creds, mountPath: /creds, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: script
              configMap:
                name: cert-push-script
            - name: certs
              secret:
                secretName: {{ $.Values.wildcardSecret }}
                defaultMode: 0440 # group-readable: with fsGroup the non-root user reads it, nobody else can
            - name: creds
              secret:
                secretName: cert-push-creds
                defaultMode: 0440
            - name: tmp
              emptyDir:
                medium: Memory # cookie jar and the key copy used for upload never touch a disk
                sizeLimit: 16Mi
{{- end }}
