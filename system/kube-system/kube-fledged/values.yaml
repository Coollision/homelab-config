kube-fledged:
  args:
    # periodic refresh re-pulls images that kubelet GC / `crictl rmi --prune` evicted from
    # nodes where the pod isn't running (otherwise they only get cached on a spec change)
    controllerImageCacheRefreshFrequency: 6h
    controllerCRISocketPath: /run/k3s/containerd/containerd.sock
    controllerImagePullPolicy: Always
    # increase the controllerImagePullDeadlineDuration to 20m to allow for slower image pulls
    controllerImagePullDeadlineDuration: 20m

    # enable to debug controller
    # controllerJobRetentionPolicy: retain

  # measured: controller ~13Mi / 1m CPU idle, webhook ~4Mi (one block applies to both)
  resources:
    requests:
      cpu: 5m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi
