traefik:
  commonLabels:
    app: traefik
  rbac:
    enabled: true
  ports:
    websecure:
      http:
        tls:
          enabled: true
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.<secret:kv/data/domains~local>`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      entryPoints:
        - web
  service:
    spec:
      externalTrafficPolicy: Local
      loadBalancerIP: <secret:kv/data/kube-system/traefik~ip>
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesIngress:
      publishedService:
        enabled: true
  priorityClassName: "system-cluster-critical"
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
  # Access logs are filtered to failures only (4xx/5xx + retries), so volume stays
  # low enough to ship to Loki continuously. Without this Traefik logs nothing but
  # its daily version-check line, which makes intermittent client-side errors
  # (e.g. the HA companion app failing on /?external_auth=1) impossible to attribute
  # to a proxy hop. The forwarded headers are kept so the real client IP and the
  # scheme/host HA is told about are both visible on a failed request.
  accessLog:
    enabled: true
    format: json
    filters:
      statusCodes: "400-599"
      retryAttempts: true
    fields:
      headers:
        defaultMode: drop
        names:
          X-Forwarded-For: keep
          X-Forwarded-Proto: keep
          X-Forwarded-Host: keep
          User-Agent: keep
  additionalArguments:
    - "--entryPoints.web.forwardedHeaders.trustedIPs=<secret:kv/data/kube-system/traefik~trusted-ips>"
    - "--entryPoints.websecure.forwardedHeaders.trustedIPs=<secret:kv/data/kube-system/traefik~trusted-ips>"
  deployment:
    replicas: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        # Avoid running internal Traefik replicas on the same node
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        # Prefer non-Pi nodes for better performance
        - weight: 50
          preference:
            matchExpressions:
              - key: type
                operator: NotIn
                values:
                  - rpi
  metrics:
    prometheus: {}
  experimental:
    plugins:
      # Scale-to-zero middleware plugin. Source is fetched from github.com and
      # compiled in-process (Yaegi) at Traefik startup — the pod needs github egress.
      sablier:
        moduleName: "github.com/sablierapp/sablier-traefik-plugin"
        version: "v1.3.0"

