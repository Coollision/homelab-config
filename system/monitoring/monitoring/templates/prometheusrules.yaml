apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "k3s-monitoring.fullname" . }}-recording-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k3s-monitoring.labels" . | nindent 4 }}
spec:
  groups:
    # ─────────────────────────────────────────────────────────────────────────
    # Node-level recording rules
    #
    # What is a recording rule?
    # Prometheus normally stores every raw metric it scrapes (e.g. one time series
    # per CPU core per node for node_cpu_seconds_total). When Grafana displays a
    # panel it has to sum and rate() those raw series on every page load.
    #
    # A recording rule tells Prometheus to run a query on a schedule and save the
    # result as a *new, pre-computed metric*. Benefits:
    #   1. Dashboard queries become simple lookups instead of expensive computations.
    #   2. Only the single aggregated result is stored – not all the raw series –
    #      which significantly reduces both storage and memory usage.
    #
    # Naming convention used here:  level:metric_name:operation
    #   level     = what the metric is aggregated across  (instance, namespace_pod, …)
    #   metric    = the base metric name
    #   operation = what was computed  (rate5m, ratio, bytes, …)
    # ─────────────────────────────────────────────────────────────────────────
    - name: node.recording
      # Re-evaluate every 1 minute instead of every scrape interval (45 s).
      # Using a longer interval here still gives useful graphs while reducing
      # the number of writes to the TSDB.
      interval: 1m
      rules:
        # ── CPU ────────────────────────────────────────────────────────────────
        # Pre-compute CPU utilisation per node (0 = idle, 1 = 100 % busy).
        #
        # Without this rule a dashboard panel computes:
        #   1 - avg without(cpu,mode)(rate(node_cpu_seconds_total{mode="idle"}[5m]))
        # …against one raw series per CPU core per node.
        # With this rule the panel simply queries: instance:node_cpu_utilization:rate5m
        - record: instance:node_cpu_utilization:rate5m
          expr: >-
            1 - avg without(cpu, mode) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            )

        # ── Memory ─────────────────────────────────────────────────────────────
        # Pre-compute memory utilisation per node (0 = all free, 1 = all used).
        # Uses MemAvailable so it correctly accounts for kernel buffer/cache pages
        # that the OS can reclaim under pressure.
        - record: instance:node_memory_utilization:ratio
          expr: >-
            1 - (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            )

        # ── Network ────────────────────────────────────────────────────────────
        # Pre-compute network receive rate per node in bytes/s.
        # Loopback (lo) and virtual/tunnel interfaces are excluded because they
        # represent intra-host traffic and would inflate the numbers.
        - record: instance:node_network_receive_bytes_excluding_lo:rate5m
          expr: >-
            sum without(device) (
              rate(node_network_receive_bytes_total{
                device!~"lo|veth.*|docker.*|flannel.*|cni.*|cali.*|tunl.*"
              }[5m])
            )

        # Pre-compute network transmit rate per node (same interface filter).
        - record: instance:node_network_transmit_bytes_excluding_lo:rate5m
          expr: >-
            sum without(device) (
              rate(node_network_transmit_bytes_total{
                device!~"lo|veth.*|docker.*|flannel.*|cni.*|cali.*|tunl.*"
              }[5m])
            )

    # ─────────────────────────────────────────────────────────────────────────
    # Container / Pod-level recording rules
    #
    # cAdvisor exports one time series per container for CPU and memory metrics.
    # Pods can have multiple containers (sidecars, init containers, etc.).
    # These rules sum across all containers within a pod so dashboards can show
    # per-pod totals with a simple query.
    # ─────────────────────────────────────────────────────────────────────────
    - name: container.recording
      interval: 1m
      rules:
        # ── CPU ────────────────────────────────────────────────────────────────
        # Sum CPU usage (cores) across all containers in each pod.
        # The {container!=""} filter excludes the special "pause" container that
        # Kubernetes uses for networking but that has no real workload CPU usage.
        - record: namespace_pod:container_cpu_usage:rate5m
          expr: >-
            sum by (namespace, pod) (
              rate(container_cpu_usage_seconds_total{container!=""}[5m])
            )

        # ── Memory ─────────────────────────────────────────────────────────────
        # Sum memory working-set bytes across all containers in each pod.
        # working_set = memory the kernel cannot reclaim under pressure
        # (better measure of actual memory pressure than RSS or cache-inclusive usage).
        - record: namespace_pod:container_memory_working_set:bytes
          expr: >-
            sum by (namespace, pod) (
              container_memory_working_set_bytes{container!=""}
            )

        # ── Network ────────────────────────────────────────────────────────────
        # Pre-compute network metrics per pod (aggregated from containers).
        # Using recv_bytes to identify noisy pods without tracking all TCP/UDP streams.
        - record: namespace_pod:container_network_transmit_bytes:rate5m
          expr: >-
            sum by (namespace, pod) (
              rate(container_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|flannel.*|cni.*|cali.*|tunl.*"}[5m])
            )

        - record: namespace_pod:container_network_receive_bytes:rate5m
          expr: >-
            sum by (namespace, pod) (
              rate(container_network_receive_bytes_total{device!~"lo|veth.*|docker.*|flannel.*|cni.*|cali.*|tunl.*"}[5m])
            )

    # ─────────────────────────────────────────────────────────────────────────
    # Longhorn alerts
    #
    # Robustness meanings used by Longhorn metrics:
    #   1 = healthy
    #   2 = degraded (missing healthy replica, rebuild/re-replication needed)
    #   3 = faulted (no healthy replica left)
    # ─────────────────────────────────────────────────────────────────────────
    - name: longhorn.alerts
      interval: 1m
      rules:
        - alert: LonghornVolumeReplicaRebuildInProgress
          expr: >-
            max by (volume) (
              longhorn_volume_robustness == 2
            ) > 0
          for: 15m
          labels:
            severity: warning
            category: storage
          annotations:
            summary: "Longhorn volume {{`{{ $labels.volume }}`}} is degraded and needs replica rebuild"
            description: "Longhorn reports volume {{`{{ $labels.volume }}`}} as degraded for more than 15 minutes. A replica is missing or unhealthy and Longhorn is rebuilding or re-replicating volume data."

        - alert: LonghornVolumeFaulted
          expr: >-
            max by (volume) (
              longhorn_volume_robustness == 3
            ) > 0
          for: 5m
          labels:
            severity: critical
            category: storage
          annotations:
            summary: "Longhorn volume {{`{{ $labels.volume }}`}} is faulted"
            description: "Longhorn reports volume {{`{{ $labels.volume }}`}} as faulted for more than 5 minutes. No healthy replica is currently available for this volume."

    # ─────────────────────────────────────────────────────────────────────────
    # NUT / UPS alerts (system/nut) — APC Back-UPS BX1600MI
    #
    # The BX1600MI has a well-known upstream firmware quirk (NUT #2347/#2805)
    # that makes usbhid-ups stall for ~15-40s roughly once an hour; an
    # in-container watchdog (system/nut/nut/kustomization.yaml) already
    # recovers that in place, so these alerts deliberately do NOT fire on
    # brief staleness — the `for:` windows below are sized well above that
    # known noise floor so they only page on a genuine mains-power event.
    # ─────────────────────────────────────────────────────────────────────────
    - name: nut.alerts
      interval: 1m
      rules:
        - alert: UpsOnBattery
          expr: >-
            network_ups_tools_ups_status{flag="OB"} == 1
          for: 3m
          labels:
            severity: critical
            category: power
          annotations:
            summary: "UPS is running on battery"
            description: "The APC BX1600MI (NUT) has reported On Battery for more than 3 minutes — mains power is out. See system/nut/disabled-automation/README.md for the (not yet built) graceful-shutdown plan."

        - alert: UpsBatteryLow
          expr: >-
            network_ups_tools_ups_status{flag="LB"} == 1
          for: 1m
          labels:
            severity: critical
            category: power
          annotations:
            summary: "UPS battery is low"
            description: "The APC BX1600MI (NUT) has reported Low Battery for more than 1 minute. Shutdown is imminent — connected NAS/hosts should already be shedding load."

        - alert: NutExporterMetricsMissing
          expr: >-
            absent(up{job="nut-exporter"} == 1)
          for: 15m
          labels:
            severity: warning
            category: power
          annotations:
            summary: "NUT exporter metrics missing"
            description: "No successful scrape of the nut-exporter target for 15 minutes — the UPS pod, its node, or the ServiceMonitor may be down. This is a real gap, not the known short driver stalls (which don't take the exporter itself down)."

    # ─────────────────────────────────────────────────────────────────────────
    # Synology NAS alerts (system/monitoring/home-metrics, SNMP exporter, job="snmp-exporter")
    #
    # One rule set covers every NAS the exporter scrapes; the `instance` label carries the
    # NAS name (set by the relabeling in the ServiceMonitor). Synology MIB enums used:
    #   systemStatus / powerStatus / *FanStatus : 1 = normal, 2 = failed
    #   diskStatus : 1 normal, 2 initialized, 3 not initialized, 4 system-partition failed, 5 crashed
    #   raidStatus : 1 normal, 11 degraded, 12 crashed (others = repairing/scrubbing/syncing: not paged)
    # Temperature rules replace the old hand-made Grafana rules that flapped ~90x/week;
    # long `for:` windows ride out RAID scrubs and Hyper Backup bursts.
    # ─────────────────────────────────────────────────────────────────────────
    - name: synology.alerts
      interval: 1m
      rules:
        - alert: SynologyUnreachable
          expr: >-
            up{job="snmp-exporter"} == 0
          for: 10m
          labels:
            severity: critical
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}} is unreachable"
            description: "SNMP scrape of {{`{{ $labels.instance }}`}} has failed for 10 minutes — the NAS is down, SNMP is disabled, or the network path (VLAN/site link) is broken."

        - alert: SynologySystemFailure
          expr: >-
            max by (instance) (synology_systemStatus > 1 or synology_powerStatus > 1)
          for: 5m
          labels:
            severity: critical
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}} reports a system or power failure"
            description: "Synology systemStatus/powerStatus on {{`{{ $labels.instance }}`}} is not normal for 5 minutes. Check DSM Control Panel → Info Center."

        - alert: SynologyFanFailure
          expr: >-
            max by (instance) (synology_systemFanStatus > 1 or synology_cpuFanStatus > 1)
          for: 10m
          labels:
            severity: warning
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}} fan failure"
            description: "A system or CPU fan on {{`{{ $labels.instance }}`}} reports failed for 10 minutes."

        - alert: SynologyRaidDegraded
          expr: >-
            synology_raidStatus >= 11 and synology_raidStatus <= 12
          for: 5m
          labels:
            severity: critical
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}}: {{`{{ $labels.raidName }}`}} is degraded or crashed"
            description: "Storage pool/volume {{`{{ $labels.raidName }}`}} on {{`{{ $labels.instance }}`}} has RAID status {{`{{ $value | humanize }}`}} (11 = degraded, 12 = crashed). Redundancy is lost or data is at risk."

        - alert: SynologyDiskFailure
          expr: >-
            synology_diskStatus >= 4
          for: 5m
          labels:
            severity: critical
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}}: {{`{{ $labels.diskID }}`}} has failed"
            description: "{{`{{ $labels.diskID }}`}} on {{`{{ $labels.instance }}`}} reports a failed or crashed status ({{`{{ $value | humanize }}`}})."

        - alert: SynologyDiskTemperatureHigh
          expr: >-
            max by (instance, diskID) (synology_diskTemperature) > 50
          for: 30m
          labels:
            severity: warning
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}}: {{`{{ $labels.diskID }}`}} is running hot ({{`{{ $value | humanize }}`}} °C)"
            description: "{{`{{ $labels.diskID }}`}} on {{`{{ $labels.instance }}`}} has been above 50 °C for 30 minutes (normal is 30-45 °C)."

        - alert: SynologyDiskTemperatureCritical
          expr: >-
            max by (instance, diskID) (synology_diskTemperature) > 60
          for: 10m
          labels:
            severity: critical
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}}: {{`{{ $labels.diskID }}`}} is overheating ({{`{{ $value | humanize }}`}} °C)"
            description: "{{`{{ $labels.diskID }}`}} on {{`{{ $labels.instance }}`}} has been above 60 °C for 10 minutes. Check airflow/fans and consider shutting down."

        - alert: SynologySystemTemperatureHigh
          expr: >-
            max by (instance) (synology_temperature) > 70
          for: 30m
          labels:
            severity: warning
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}} system temperature is high ({{`{{ $value | humanize }}`}} °C)"
            description: "The NAS chassis/CPU temperature on {{`{{ $labels.instance }}`}} has been above 70 °C for 30 minutes."

        - alert: SynologyVolumeLowSpace
          expr: >-
            synology_raidFreeSize{raidName=~"Volume.*"} / synology_raidTotalSize{raidName=~"Volume.*"} < 0.10
          for: 1h
          labels:
            severity: warning
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}}: {{`{{ $labels.raidName }}`}} has {{`{{ $value | humanizePercentage }}`}} free"
            description: "{{`{{ $labels.raidName }}`}} on {{`{{ $labels.instance }}`}} is below 10% free space."

        - alert: SynologyVolumeAlmostFull
          expr: >-
            synology_raidFreeSize{raidName=~"Volume.*"} / synology_raidTotalSize{raidName=~"Volume.*"} < 0.05
          for: 30m
          labels:
            severity: critical
            category: nas
          annotations:
            summary: "NAS {{`{{ $labels.instance }}`}}: {{`{{ $labels.raidName }}`}} is almost full ({{`{{ $value | humanizePercentage }}`}} free)"
            description: "{{`{{ $labels.raidName }}`}} on {{`{{ $labels.instance }}`}} is below 5% free space. Writes may start failing."

    # ─────────────────────────────────────────────────────────────────────────
    # cert-manager certificate alerts. Renewal normally happens ~30 days before expiry,
    # so "expires within 14d" means automatic renewal is stuck.
    # ─────────────────────────────────────────────────────────────────────────
    - name: certificates.alerts
      interval: 5m
      rules:
        - alert: CertificateNotReady
          expr: >-
            certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
            category: certificates
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}/{{ $labels.name }}`}} is not ready"
            description: "cert-manager reports Certificate {{`{{ $labels.namespace }}/{{ $labels.name }}`}} as not Ready for 30 minutes (issuance or renewal is failing). Check `kubectl describe certificate` and the issuer/ACME challenge."

        - alert: CertificateExpiringSoon
          expr: >-
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
          for: 1h
          labels:
            severity: warning
            category: certificates
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}/{{ $labels.name }}`}} expires in under 14 days"
            description: "Certificate {{`{{ $labels.namespace }}/{{ $labels.name }}`}} has not been renewed and expires in {{`{{ $value | humanizeDuration }}`}}."

        - alert: CertificateExpiryImminent
          expr: >-
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 3 * 86400
          for: 10m
          labels:
            severity: critical
            category: certificates
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}/{{ $labels.name }}`}} expires in under 3 days"
            description: "Certificate {{`{{ $labels.namespace }}/{{ $labels.name }}`}} expires in {{`{{ $value | humanizeDuration }}`}}. Renewal has failed — services will start showing TLS errors."
