---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smb-operator-config
  namespace: storage
data:
  config.yaml: |
    operator:
      namespace: storage
      reconcileInterval: 30
      useWatchAPI: true
      logLevel: INFO
      healthPort: 8080

    smb:
      deploymentName: smb-server
      serviceName: smb-server
      image: crazymax/samba:latest
      workgroup: WORKGROUP
      serverString: Homelab Storage Server
      # 'soft' is required: Longhorn stops a share-manager the moment its volume
      # detaches (e.g. an app scaled to zero by Sablier). A hard mount against the
      # dead server wedges smbd in uninterruptible sleep and the pod hangs in
      # Terminating forever, blocking its own replacement. timeo is in deciseconds.
      nfsMountOptions: vers=4.2,noresvport,soft,timeo=50,retrans=2
      # In-pod mount reconciler: applies endpoint attach/detach without restarting SMB.
      # Kubelet takes up to ~60s to propagate a ConfigMap change into the pod, so
      # polling much faster than this buys nothing.
      mountReconcileInterval: 15
      # How long smbd waits at startup for the initial mounts before accepting clients.
      initialMountWait: 30
      security:
        encryptionLevel: default
        ntlmAuth: yes
        restrictAnonymous: "1"
        disableGuestAccess: true

    longhorn:
      namespace: storage
      group: longhorn.io
      version: v1beta2
      plural: volumes

    resources:
      smbServer:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 2000m
          memory: 512Mi
      operator:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    retry:
      maxRetries: 3
      initialDelay: 1
      backoffMultiplier: 2
      retryableStatusCodes: [409, 429, 500, 503, 504]
