cloudnative-pg:
  # Operator manages its own CRDs (Cluster, Database, Publication, ...)
  crds:
    create: true

  # Operator metrics (reconcile errors, webhook requests) feed the operator panels of the
  # CloudNativePG dashboard in the monitoring chart; the cluster pods are scraped there too.
  monitoring:
    podMonitorEnabled: true
    grafanaDashboard:
      create: false

  # Lean footprint for a homelab single-cluster controller.
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi
